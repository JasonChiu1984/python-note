<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="687" viewBox="0 0 1120 687" role="img" aria-labelledby="diagram-title diagram-desc" lang="zh-Hant">
  <title id="diagram-title">工業資料採集 Gateway 架構</title>
  <desc id="diagram-desc">現場儀表、DDC 與 PLC 將唯讀資料送入 Gateway，經協定轉接、點位與品質映射、持久佇列，跨 OT DMZ 提供 MQTT 或 HTTPS 給 SCADA、歷史庫及 API。現場安全控制獨立。</desc>
  <style>text{font-family:system-ui,"Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.main{fill:#152f49}.muted{fill:#324c64}</style>
  <defs>
    <marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#244e73" />
    </marker>
    <marker id="local" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8b593b" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="687" rx="12" fill="#f7fafc" stroke="none" />
  <rect x="0" y="0" width="1120" height="82" rx="0" fill="#142f49" stroke="none" />
  <text x="24" y="40" font-size="30" font-weight="750" fill="#fff">工業資料採集 Gateway 架構</text>
  <text x="25" y="65" font-size="16" font-weight="400" fill="#d7e8f6">資料唯讀上送；PLC 與安全控制不依賴 Gateway</text>
  <rect x="20" y="100" width="239" height="410" rx="12" fill="#eaf3fb" stroke="#b3cee6" id="zone-field" />
  <text x="32" y="126" font-size="15" font-weight="750" fill="#285985" data-box="zone-field">01 / OT 現場</text>
  <rect x="289" y="100" width="280" height="410" rx="12" fill="#eaf6f4" stroke="#b5d9d2" id="zone-gateway" />
  <text x="301" y="126" font-size="15" font-weight="750" fill="#17655f" data-box="zone-gateway">02 / EDGE GATEWAY</text>
  <rect x="599" y="100" width="232" height="410" rx="12" fill="#fdf3e6" stroke="#e8ca9b" id="zone-dmz" />
  <text x="611" y="126" font-size="15" font-weight="750" fill="#855320" data-box="zone-dmz">03 / OT DMZ</text>
  <rect x="861" y="100" width="239" height="410" rx="12" fill="#f1edfa" stroke="#d1c4e6" id="zone-apps" />
  <text x="873" y="126" font-size="15" font-weight="750" fill="#584480" data-box="zone-apps">04 / IT 消費端</text>
  <polyline points="243,185 310,185" fill="none" stroke="#244e73" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#data)" aria-hidden="true" />
  <polyline points="243,290 275,290 275,209 310,209" fill="none" stroke="#244e73" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#data)" aria-hidden="true" />
  <polyline points="139,385 139,344" fill="none" stroke="#8b593b" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#local)" aria-hidden="true" stroke-dasharray="4 3" marker-start="url(#local)" />
  <polyline points="429,229 429,257" fill="none" stroke="#244e73" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#data)" aria-hidden="true" />
  <polyline points="429,344 429,373" fill="none" stroke="#244e73" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#data)" aria-hidden="true" />
  <polyline points="548,416 617,416" fill="none" stroke="#244e73" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#data)" aria-hidden="true" />
  <polyline points="813,416 879,416" fill="none" stroke="#244e73" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#data)" aria-hidden="true" />
  <rect x="36" y="143" width="207" height="85" rx="9" fill="#fff" stroke="#b3cee6" id="card-bms" />
  <text x="47" y="169" font-size="17" font-weight="750" fill="#285985" data-box="card-bms">BMS / 儀表與 DDC</text>
  <text x="47" y="192" font-size="14" font-weight="400" fill="#324c64" data-box="card-bms">Modbus RTU / TCP</text>
  <text x="47" y="211" font-size="14" font-weight="400" fill="#324c64" data-box="card-bms">BACnet MS/TP、IP、SC</text>
  <rect x="36" y="256" width="207" height="88" rx="9" fill="#fff" stroke="#b3cee6" id="card-plc" />
  <text x="47" y="282" font-size="17" font-weight="750" fill="#285985" data-box="card-plc">PLC / 設備標籤</text>
  <text x="47" y="305" font-size="14" font-weight="400" fill="#324c64" data-box="card-plc">OPC UA / EtherNet/IP</text>
  <text x="47" y="324" font-size="14" font-weight="400" fill="#324c64" data-box="card-plc">依白名單唯讀採集</text>
  <rect x="36" y="385" width="207" height="90" rx="9" fill="#fff" stroke="#b3cee6" id="card-local" />
  <text x="47" y="411" font-size="17" font-weight="750" fill="#285985" data-box="card-local">現場 I/O（本地）</text>
  <text x="47" y="434" font-size="14" font-weight="400" fill="#324c64" data-box="card-local">PROFINET / EtherCAT</text>
  <text x="47" y="453" font-size="14" font-weight="400" fill="#324c64" data-box="card-local">即時控制由 PLC 執行</text>
  <rect x="310" y="143" width="238" height="86" rx="9" fill="#fff" stroke="#b5d9d2" id="card-adapter" />
  <text x="321" y="169" font-size="17" font-weight="750" fill="#17655f" data-box="card-adapter">南向協定轉接</text>
  <text x="321" y="192" font-size="14" font-weight="400" fill="#324c64" data-box="card-adapter">分路輪詢 / 訂閱</text>
  <text x="321" y="211" font-size="14" font-weight="400" fill="#324c64" data-box="card-adapter">各路獨立逾時與退避</text>
  <rect x="310" y="257" width="238" height="87" rx="9" fill="#fff" stroke="#b5d9d2" id="card-map" />
  <text x="321" y="283" font-size="17" font-weight="750" fill="#17655f" data-box="card-map">點位映射與品質</text>
  <text x="321" y="306" font-size="14" font-weight="400" fill="#324c64" data-box="card-map">型別、倍率、單位、UTC</text>
  <text x="321" y="325" font-size="14" font-weight="400" fill="#324c64" data-box="card-map">保留來源狀態與陳舊標記</text>
  <rect x="310" y="373" width="238" height="101" rx="9" fill="#fff" stroke="#b5d9d2" id="card-outbox" />
  <text x="321" y="399" font-size="17" font-weight="750" fill="#17655f" data-box="card-outbox">持久佇列 Outbox</text>
  <text x="321" y="422" font-size="14" font-weight="400" fill="#324c64" data-box="card-outbox">先落盤、批次補送</text>
  <text x="321" y="441" font-size="14" font-weight="400" fill="#324c64" data-box="card-outbox">事件 ID 去重 / 確認後釋放</text>
  <rect x="617" y="367" width="196" height="106" rx="9" fill="#fff" stroke="#e8ca9b" id="card-dmz" />
  <text x="628" y="393" font-size="17" font-weight="750" fill="#855320" data-box="card-dmz">隔離區資料入口</text>
  <text x="628" y="416" font-size="14" font-weight="400" fill="#324c64" data-box="card-dmz">MQTT Broker：遙測</text>
  <text x="628" y="435" font-size="14" font-weight="400" fill="#324c64" data-box="card-dmz">HTTPS 接收 API：選用</text>
  <text x="628" y="454" font-size="14" font-weight="400" fill="#324c64" data-box="card-dmz">確認只走已建立的連線</text>
  <rect x="879" y="367" width="203" height="106" rx="9" fill="#fff" stroke="#d1c4e6" id="card-apps" />
  <text x="890" y="393" font-size="17" font-weight="750" fill="#584480" data-box="card-apps">監控與資料服務</text>
  <text x="890" y="416" font-size="14" font-weight="400" fill="#324c64" data-box="card-apps">SCADA / Historian</text>
  <text x="890" y="435" font-size="14" font-weight="400" fill="#324c64" data-box="card-apps">資料庫、報表與 API</text>
  <text x="890" y="454" font-size="14" font-weight="400" fill="#324c64" data-box="card-apps">應用端按事件 ID 去重</text>
  <rect x="20" y="529" width="1080" height="60" rx="12" fill="#fff4ed" stroke="#e2b9a5" id="safety" />
  <text x="32" y="551" font-size="17" font-weight="750" fill="#93401d" data-box="safety">獨立安全路徑：硬接線急停 / 安全 PLC</text>
  <text x="32" y="573" font-size="14" font-weight="400" fill="#6e412d" data-box="safety">安全連鎖不得經由 Gateway 或上層平台。</text>
  <text x="20" y="615" font-size="14" font-weight="400" fill="#324c64">實線：遙測方向；虛線：現場控制路徑。</text>
  <text x="20" y="635" font-size="14" font-weight="400" fill="#324c64">箭頭表示遙測資料方向，協定交握或確認不代表開放反向 OT 存取。</text>
  <text x="20" y="655" font-size="14" font-weight="400" fill="#324c64">MQTT Broker 的 PUBACK 不等於時序資料庫已寫入；若要求入庫保證，需另有應用層確認。</text>
</svg>