<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="896" viewBox="0 0 2048 896" role="img" aria-labelledby="production-title production-desc" lang="en">
<title id="production-title">Production notes-cli delivery workflow</title>
<desc id="production-desc">Requirements, ADR, SLO, Boundary, Config, Migration, Tests, CI, and Release are connected in sequence. Rollback follows only when a release fails.</desc>
<style>text {font-family:Arial, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif;} .edge {fill:none;stroke:#2f73c5;stroke-width:3.2;stroke-linejoin:round;stroke-linecap:butt;marker-end:url(#production-arrow);}</style>
<defs><marker id="production-arrow" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2f73c5" /></marker></defs>
<rect width="2048" height="896" fill="#f6f8fa" />
<text x="38" y="107" font-size="66" font-weight="750" fill="#192434">Production notes-cli: End-to-End Delivery</text>
<text x="38" y="161" font-size="25" fill="#617186">An engineering appendix to the beginner guide: follow notes-cli from requirements to release and rollback.</text>
<text x="38" y="203" font-size="25" fill="#617186">Continue with the intermediate and advanced guides for hands-on engineering practice.</text>
