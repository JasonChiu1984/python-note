<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img" aria-labelledby="diagram-title diagram-desc" lang="en" style="font-family:Arial, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <title id="diagram-title">Python Project Delivery Blueprint</title>
  <desc id="diagram-desc">Input Layer connects to Service Core and Evidence. Service Core also connects to Governance and Acceptance. All text stays inside the cards.</desc>
  <rect width="1400" height="950" fill="#F5F9FA" />
  <rect x="40" y="40" width="1320" height="870" rx="40" fill="#FFFFFF" stroke="#D6E1EB" stroke-width="3" data-frame="true" />
  <text id="page_title" x="104" y="147" font-family="Arial, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="50" font-weight="700" fill="#172337" data-label="page-title" xml:space="preserve">Python Project Delivery Blueprint</text>
  <text id="page_subtitle" x="104" y="207" font-family="Arial, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="400" fill="#5C7494" data-label="page-subtitle" xml:space="preserve">From requirements and configuration to execution, verification, and release evidence</text>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-connectors="true">
    <path id="input_to_service" d="M 454 360 L 524 360" stroke="#247F7D" stroke-width="7" data-source="input" data-target="service" />
    <path id="service_to_evidence" d="M 874 360 L 944 360" stroke="#2E70B4" stroke-width="7" data-source="service" data-target="evidence" />
    <path id="service_to_branch" d="M 699 450 L 699 510" stroke="#8393A8" stroke-width="6" data-source="service" data-target="branch" />
    <path id="branch_to_governance" d="M 699 510 L 406 510" stroke="#8393A8" stroke-width="6" data-source="branch" data-target="branch_governance" />
    <path id="branch_to_acceptance" d="M 699 510 L 994 510" stroke="#8393A8" stroke-width="6" data-source="branch" data-target="branch_acceptance" />
    <path id="governance_link" d="M 406 510 L 406 580" stroke="#8393A8" stroke-width="6" data-source="branch_governance" data-target="governance" />
    <path id="acceptance_link" d="M 994 510 L 994 580" stroke="#8393A8" stroke-width="6" data-source="branch_acceptance" data-target="acceptance" />
  </g>
  <g data-node="input" transform="translate(104 270)">
    <rect x="0" y="0" width="350" height="180" rx="30" fill="#E5F5F2" stroke="#82CAC1" stroke-width="2" data-box="true" />
    <text id="input_title" x="32" y="58" font-family="Arial, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="34" font-weight="700" fill="#247F7D" data-label="title" xml:space="preserve">Input Layer</text>
    <text id="input_line_1" x="32" y="107" font-family="Arial, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="400" fill="#294F5E" data-label="line-1" xml:space="preserve">operator config</text>
    <text id="input_line_2" x="32" y="146" font-family="Arial, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="400" fill="#294F5E" data-label="line-2" xml:space="preserve">device snapshots</text>
  </g>
  <g data-node="service" transform="translate(524 270)">
    <rect x="0" y="0" width="350" height="180" rx="30" fill="#EDF4FB" stroke="#9ABBDD" stroke-width="2" data-box="true" />
    <text id="service_title" x="32" y="58" font-family="Arial, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="34" font-weight="700" fill="#2E70B4" data-label="title" xml:space="preserve">Service Core</text>
    <text id="service_line_1" x="32" y="107" font-family="Arial, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="400" fill="#294F5E" data-label="line-1" xml:space="preserve">validation</text>
    <text id="service_line_2" x="32" y="146" font-family="Arial, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="400" fill="#294F5E" data-label="line-2" xml:space="preserve">idempotency + alarm</text>
  </g>
  <g data-node="evidence" transform="translate(944 270)">
    <rect x="0" y="0" width="350" height="180" rx="30" fill="#F5EFFA" stroke="#B9A0DB" stroke-width="2" data-box="true" />
    <text id="evidence_title" x="32" y="58" font-family="Arial, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="34" font-weight="700" fill="#7651AA" data-label="title" xml:space="preserve">Evidence</text>
    <text id="evidence_line_1" x="32" y="107" font-family="Arial, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="400" fill="#294F5E" data-label="line-1" xml:space="preserve">health report</text>
    <text id="evidence_line_2" x="32" y="146" font-family="Arial, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="400" fill="#294F5E" data-label="line-2" xml:space="preserve">release payload</text>
  </g>
  <g data-node="governance" transform="translate(156 580)">
    <rect x="0" y="0" width="500" height="250" rx="32" fill="#FFFFFF" stroke="#D6E1EB" stroke-width="2" data-box="true" />
    <text id="governance_title" x="32" y="62" font-family="Arial, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="36" font-weight="700" fill="#172337" data-label="title" xml:space="preserve">Governance</text>
    <text id="governance_line_1" x="32" y="113" font-family="Arial, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" font-weight="400" fill="#5C7494" data-label="line-1" xml:space="preserve">schema / config contract</text>
    <text id="governance_line_2" x="32" y="155" font-family="Arial, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" font-weight="400" fill="#5C7494" data-label="line-2" xml:space="preserve">timeout / retry / fail-safe</text>
    <text id="governance_line_3" x="32" y="197" font-family="Arial, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" font-weight="400" fill="#5C7494" data-label="line-3" xml:space="preserve">audit trail / runbook / rollback</text>
  </g>
  <g data-node="acceptance" transform="translate(744 580)">
    <rect x="0" y="0" width="500" height="250" rx="32" fill="#FFFFFF" stroke="#D6E1EB" stroke-width="2" data-box="true" />
    <text id="acceptance_title" x="32" y="62" font-family="Arial, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="36" font-weight="700" fill="#172337" data-label="title" xml:space="preserve">Acceptance</text>
    <text id="acceptance_line_1" x="32" y="113" font-family="Arial, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" font-weight="400" fill="#5C7494" data-label="line-1" xml:space="preserve">py_compile / unittest</text>
    <text id="acceptance_line_2" x="32" y="155" font-family="Arial, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" font-weight="400" fill="#5C7494" data-label="line-2" xml:space="preserve">smoke / HTML parse</text>
    <text id="acceptance_line_3" x="32" y="197" font-family="Arial, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" font-weight="400" fill="#5C7494" data-label="line-3" xml:space="preserve">git diff --check / release note</text>
  </g>
</svg>