[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-version-readiness"
version = "1.0.0"
description = "Python runtime readiness report sample"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
python-version-readiness = "version_readiness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

