[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pandas-etl-report"
version = "0.1.0"
description = "Minimal Pandas ETL report pipeline for the Python learning notes."
requires-python = ">=3.10"
dependencies = ["pandas>=2"]

[project.optional-dependencies]
test = ["pytest>=8"]
parquet = ["pyarrow>=15"]
excel = ["openpyxl>=3"]

[project.scripts]
pandas-etl-report = "pandas_etl_report.cli:main"
