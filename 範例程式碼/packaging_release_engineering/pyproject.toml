[project]
name = "packaging-release-engineering"
version = "0.1.0"
description = "Standard-library release gate sample for Python packaging tutorials."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Python Learning Notes" }]

[project.scripts]
packaging-release-gate = "packaging_release_engineering.cli:main"

[tool.release_gate]
package = "packaging_release_engineering"
changelog = "CHANGELOG.md"
dist_dir = "dist"
