[project]
name = "integration-resilience"
version = "0.1.0"
description = "Standard-library API integration resilience sample for Python tutorials"
requires-python = ">=3.11"

[tool.integration_resilience]
timeout_seconds = 2.0
max_attempts = 3
backoff_seconds = 0.2
circuit_failure_threshold = 2
rate_limit_per_minute = 60
