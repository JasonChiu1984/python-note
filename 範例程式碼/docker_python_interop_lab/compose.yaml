services:
  telemetry:
    build: .
    image: python-interop-lab:local
    ports:
      - "127.0.0.1:18080:8080"
    read_only: true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 8
      start_period: 3s
