[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numpy-feature-pipeline"
version = "0.1.0"
description = "Minimal NumPy feature matrix pipeline for the Python learning notes."
requires-python = ">=3.10"
dependencies = ["numpy>=2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
numpy-feature-pipeline = "numpy_feature_pipeline.cli:main"
