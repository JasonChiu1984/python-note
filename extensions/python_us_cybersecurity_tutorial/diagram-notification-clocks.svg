<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="dg-usc-title dg-usc-desc" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <title id="dg-usc-title">美國多軌通報時鐘：同一事件、不同起算點</title>
  <desc id="dg-usc-desc">對應延伸範例與現場案例。一起 OT 網路勒索事件，先逐項判斷各制度是否適用；不適用就不建立該時鐘，並記錄判斷依據。適用的時鐘依起算點分成三組。第一組從 2026-11-24（週二）認定具重大性起算：SEC 8-K Item 1.05 為 4 個營業日，add_business_days() 跳過週末與聯邦假日（含 observed 日），11/26 感恩節不計，期限 2026-12-01（週二）。第二組從 2026-11-20 發現事件起算，以日曆日計算：FTC Safeguards（500 人以上）30 日與紐約 GBL 第 899-aa 條 30 日都是 2026-12-20，HIPAA 個人通知上限 60 日為 2027-01-19。第三組從 2026-11-22 認定外洩起算：德州州檢察長 30 日為 2026-12-22，受影響個人 60 日為 2027-01-21。CIRCIA 的 72 小時事件通報與贖金支付 24 小時，最終規則尚未刊登生效，時鐘尚未啟動，生效後再依最終規則的起算條件加入。日期都是範例實際輸出；範例只算日期，不判斷是否適用，「發現」與「認定」的時點由法務認定。上限不是目標，HIPAA 另要求無不合理延遲。</desc>
  <defs>
    <marker id="dg-usc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <rect class="dg-box" x="150" y="12" width="460" height="48" rx="24"/>
    <polygon class="dg-box" points="380,84 560,118 380,152 200,118"/>
    <rect class="dg-box dg-blue" x="20" y="192" width="230" height="52" rx="6" stroke="#3b82f6"/>
    <rect class="dg-box dg-blue" x="265" y="192" width="230" height="52" rx="6" stroke="#3b82f6"/>
    <rect class="dg-box dg-blue" x="510" y="192" width="230" height="52" rx="6" stroke="#3b82f6"/>
    <rect class="dg-box" x="20" y="268" width="230" height="116" rx="6"/>
    <rect class="dg-box" x="265" y="268" width="230" height="116" rx="6"/>
    <rect class="dg-box" x="510" y="268" width="230" height="116" rx="6"/>
  </g>
  <rect class="dg-red" x="600" y="94" width="145" height="48" rx="6" stroke="#d64545" stroke-width="1.5" fill="none"/>
  <rect class="dg-orange dg-dash" x="20" y="408" width="720" height="48" rx="6" stroke="#e07b1f" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <line x1="380" y1="152" x2="380" y2="172"/>
    <line x1="135" y1="172" x2="625" y2="172"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-usc-arrow)">
    <line x1="380" y1="60" x2="380" y2="82"/>
    <line x1="560" y1="118" x2="598" y2="118"/>
    <line x1="135" y1="172" x2="135" y2="190"/>
    <line x1="380" y1="172" x2="380" y2="190"/>
    <line x1="625" y1="172" x2="625" y2="190"/>
    <line x1="135" y1="244" x2="135" y2="266"/>
    <line x1="380" y1="244" x2="380" y2="266"/>
    <line x1="625" y1="244" x2="625" y2="266"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="380" y="33" font-weight="700">OT 網路勒索事件：同一事件、多條時鐘</text>
    <text x="380" y="51" font-size="12">各時鐘的起算點不同，不能用同一個日期套全部</text>
    <text x="380" y="123">這個制度適用嗎？</text>
    <text x="672" y="114" font-weight="700">否：不建立</text>
    <text x="672" y="132" font-size="12">記錄判斷依據</text>
    <text x="135" y="214" font-weight="700">認定具重大性</text>
    <text x="135" y="234" font-size="12">2026-11-24（週二）</text>
    <text x="380" y="214" font-weight="700">發現事件</text>
    <text x="380" y="234" font-size="12">2026-11-20</text>
    <text x="625" y="214" font-weight="700">認定外洩（德州）</text>
    <text x="625" y="234" font-size="12">2026-11-22</text>
    <text x="135" y="290" font-weight="700">SEC 8-K Item 1.05</text>
    <text x="380" y="290" font-weight="700">日曆日：發現日起算</text>
    <text x="625" y="290" font-weight="700">日曆日：認定日起算</text>
  </g>
  <g fill="currentColor" text-anchor="middle" font-size="12">
    <text x="135" y="312">4 個營業日：跳過週末與</text>
    <text x="135" y="330">聯邦假日（含 observed 日）</text>
    <text x="135" y="348">11/26 感恩節不計</text>
    <text x="380" y="312">FTC Safeguards（≥500 人）30 日</text>
    <text x="380" y="330">紐約 GBL §899-aa 30 日</text>
    <text x="380" y="348">HIPAA 個人通知上限 60 日</text>
    <text x="625" y="312">州檢察長 30 日</text>
    <text x="625" y="330">受影響個人 60 日</text>
  </g>
  <g fill="currentColor" text-anchor="middle" font-size="12" font-weight="700">
    <text x="135" y="372">→ 2026-12-01（週二）</text>
    <text x="380" y="372">→ 12-20、12-20、2027-01-19</text>
    <text x="625" y="372">→ 2026-12-22、2027-01-21</text>
    <text x="388" y="167" font-weight="400" text-anchor="start">是</text>
    <text x="578" y="111" font-weight="400">否</text>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="380" y="428" font-weight="700">CIRCIA：72 小時事件通報、贖金支付 24 小時</text>
    <text x="380" y="446" font-size="12">最終規則尚未刊登生效，時鐘尚未啟動；生效後再依最終規則的起算條件加入</text>
  </g>
  <g fill="currentColor" text-anchor="middle" font-size="12">
    <text x="380" y="484">日期都是範例實際輸出。範例只算日期，不判斷是否適用；「發現」「認定」的時點由法務認定。</text>
    <text x="380" y="504">上限不是目標：HIPAA 另要求無不合理延遲；各機關的受件方式與內容要求另行確認。</text>
  </g>
</svg>
