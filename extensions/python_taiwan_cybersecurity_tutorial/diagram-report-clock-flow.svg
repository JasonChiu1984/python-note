<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 672" role="img" aria-labelledby="dg-twc-title dg-twc-desc" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <title id="dg-twc-title">資安事件通報時鐘：從告警、知悉到各期限</title>
  <desc id="dg-twc-desc">對應延伸範例的 milestones() 與 report_status()。第一筆告警（例 02:40）要記錄，但不是時限起點。研判是否為資安事件：否則依設備故障處理並保留紀錄；是則記下知悉時間（例 03:15）、判定人與依據，所有時限從知悉起算。通報期限是知悉加 1 小時，例 04:15。report_status() 比較實際通報時間與期限：未超過為如期，例 04:05；超過則顯示逾時分鐘數，未滿 1 分鐘以 1 分鐘計，若誤把 02:40 當知悉時間，04:05 通報就是逾時 25 分鐘。損害控制或復原期限依等級：第 3、4 級知悉起 36 小時，例 11-29 15:15；第 1、2 級 72 小時，例 12-01 03:15。是否構成事件、事件等級與適用身分要依法規與納管文件判斷，工具只算時間。</desc>
  <defs>
    <marker id="dg-twc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <rect class="dg-box dg-blue" x="40" y="12" width="380" height="50" rx="25" stroke="#3b82f6"/>
    <polygon class="dg-box" points="230,86 400,118 230,150 60,118"/>
    <rect class="dg-box" x="40" y="174" width="380" height="50" rx="6"/>
    <rect class="dg-box" x="40" y="248" width="380" height="50" rx="6"/>
    <polygon class="dg-box" points="230,322 400,354 230,386 60,354"/>
    <polygon class="dg-box" points="230,434 380,466 230,498 80,466"/>
  </g>
  <g stroke-width="1.5" fill="none">
    <rect class="dg-box" x="470" y="90" width="270" height="56" rx="6" stroke="currentColor"/>
    <rect class="dg-red" x="470" y="326" width="270" height="56" rx="6" stroke="#d64545"/>
    <rect class="dg-orange" x="470" y="438" width="270" height="56" rx="6" stroke="#e07b1f"/>
    <rect class="dg-green" x="40" y="522" width="380" height="50" rx="6" stroke="#2f9e5b"/>
    <rect class="dg-blue" x="40" y="602" width="700" height="56" rx="6" stroke="#3b82f6"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-twc-arrow)">
    <line x1="230" y1="62" x2="230" y2="84"/>
    <line x1="400" y1="118" x2="468" y2="118"/>
    <line x1="230" y1="150" x2="230" y2="172"/>
    <line x1="230" y1="224" x2="230" y2="246"/>
    <line x1="230" y1="298" x2="230" y2="320"/>
    <line x1="400" y1="354" x2="468" y2="354"/>
    <line x1="230" y1="386" x2="230" y2="432"/>
    <line x1="380" y1="466" x2="468" y2="466"/>
    <line x1="230" y1="498" x2="230" y2="520"/>
  </g>
  <g stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4" fill="none" marker-end="url(#dg-twc-arrow)">
    <polyline points="605,382 605,418 234,418"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="230" y="33" font-weight="700">第一筆告警（例 02:40）</text>
    <text x="230" y="52" font-size="12">要記錄，但不是時限起點</text>
    <text x="230" y="123">研判：是資安事件嗎？</text>
    <text x="605" y="113" font-weight="700">依設備故障處理</text>
    <text x="605" y="133" font-size="12">保留紀錄，日後檢討時比對</text>
    <text x="230" y="195" font-weight="700">知悉時間 aware（例 03:15）</text>
    <text x="230" y="214" font-size="12">記錄判定人與依據，台北時間並附 UTC</text>
    <text x="230" y="269" font-weight="700">milestones()：通報期限 ＝ aware ＋ 1 h</text>
    <text x="230" y="288" font-size="12">例 11-28 04:15</text>
    <text x="230" y="351">report_status()</text>
    <text x="230" y="368" font-size="12">實際通報 ≤ 期限？</text>
    <text x="605" y="349" font-weight="700">逾時 N 分鐘（仍要通報）</text>
    <text x="605" y="369" font-size="12">未滿 1 分鐘以 1 分鐘計</text>
    <text x="230" y="471">等級 ≥ 3？</text>
    <text x="605" y="461" font-weight="700">損害控制或復原：36 h</text>
    <text x="605" y="481" font-size="12">例 11-29 15:15</text>
    <text x="230" y="543" font-weight="700">損害控制或復原：72 h（第 1、2 級）</text>
    <text x="230" y="562" font-size="12">例 12-01 03:15</text>
    <text x="390" y="625" font-weight="700">工具只算時間</text>
    <text x="390" y="645" font-size="12">是否構成事件、事件等級與適用身分，要依法規與實際納管文件判斷。</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="440" y="411">兩條路徑都繼續倒數</text>
    <text x="410" y="110">否</text>
    <text x="238" y="166">是</text>
    <text x="410" y="346">否</text>
    <text x="238" y="404">是：如期（例 04:05）</text>
    <text x="390" y="458">是</text>
    <text x="238" y="514">否</text>
  </g>
</svg>
