<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="dg-wsa-title dg-wsa-desc" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <title id="dg-wsa-title">擷取點架構：交換器鏡像埠看得到什麼</title>
  <desc id="dg-wsa-desc">對應延伸學習的現場案例與範例封包。BAS 主機 192.168.10.5 從埠 50123 以 Modbus TCP 連到 192.168.10.20 的 502 埠，Unit ID 1。兩者之間經過一台交換器，交換器設定鏡像埠（SPAN）把流量複製到擷取電腦。擷取電腦用 Wireshark 或 TShark 存成 pcap，再由 Python 的 struct 逐層解析，或用 tshark 匯出 CSV 統計回應時間與例外碼。若 192.168.10.20 是 Modbus 閘道器，後端 RS-485 上的 RTU 交易不在鏡像範圍內，需要另用序列監聽工具。</desc>
  <defs>
    <marker id="dg-wsa-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke-width="1.5" fill="none">
    <rect class="dg-blue" x="20" y="40" width="190" height="60" rx="6" stroke="#3b82f6"/>
    <rect class="dg-box" x="285" y="40" width="190" height="60" rx="6" stroke="currentColor"/>
    <rect class="dg-box" x="550" y="40" width="190" height="60" rx="6" stroke="currentColor"/>
    <rect class="dg-box dg-dash" x="550" y="170" width="190" height="60" rx="6" stroke="currentColor" stroke-dasharray="6 4"/>
    <rect class="dg-orange" x="285" y="170" width="190" height="60" rx="6" stroke="#e07b1f"/>
    <rect class="dg-green" x="160" y="300" width="200" height="60" rx="6" stroke="#2f9e5b"/>
    <rect class="dg-green" x="410" y="300" width="200" height="60" rx="6" stroke="#2f9e5b"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-wsa-arrow)">
    <line x1="210" y1="70" x2="283" y2="70"/>
    <line x1="475" y1="70" x2="548" y2="70"/>
    <line x1="380" y1="100" x2="380" y2="168"/>
    <line x1="340" y1="230" x2="270" y2="298"/>
    <line x1="420" y1="230" x2="500" y2="298"/>
  </g>
  <g stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4" fill="none">
    <line x1="645" y1="100" x2="645" y2="170"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="115" y="65" font-weight="700">BAS 主機</text>
    <text x="115" y="85" font-size="12">192.168.10.5:50123</text>
    <text x="380" y="65" font-weight="700">交換器</text>
    <text x="380" y="85" font-size="12">設定鏡像埠（SPAN）</text>
    <text x="645" y="65" font-weight="700">電表或閘道器</text>
    <text x="645" y="85" font-size="12">192.168.10.20:502，Unit 1</text>
    <text x="645" y="195" font-weight="700">RS-485 後端</text>
    <text x="645" y="215" font-size="12">不在鏡像範圍，需序列監聽</text>
    <text x="380" y="195" font-weight="700">擷取電腦</text>
    <text x="380" y="215" font-size="12">Wireshark／TShark → pcap</text>
    <text x="260" y="325" font-weight="700">Python struct 逐層解析</text>
    <text x="260" y="345" font-size="12">範例的 parse()</text>
    <text x="510" y="325" font-weight="700">tshark 匯出 CSV</text>
    <text x="510" y="345" font-size="12">統計回應時間與例外碼</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="247" y="60" text-anchor="middle" font-size="11">Modbus TCP</text>
    <text x="511" y="60" text-anchor="middle" font-size="11">FC03 請求</text>
    <text x="388" y="140">複製流量</text>
    <text x="653" y="140">若是閘道器</text>
  </g>
  <text x="380" y="400" fill="currentColor" text-anchor="middle" font-size="12">記錄擷取點、時間同步方式與篩選條件；擷取檔可能含帳密或個資，分享前先確認權限。</text>
</svg>
