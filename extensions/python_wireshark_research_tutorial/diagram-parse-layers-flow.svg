<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-labelledby="dg-wsp-title dg-wsp-desc" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <title id="dg-wsp-title">parse() 逐層解析：每層的位元組位置與位元組順序</title>
  <desc id="dg-wsp-desc">對應延伸範例 build_pcap() 產生的 106 位元組 pcap 檔與 parse()。檔案位移 0 到 24 是全域標頭，little-endian，magic 0xA1B2C3D4，linktype 1。24 到 40 是記錄標頭，little-endian，記錄長度 66。40 起是 66 位元組的乙太網路訊框，以下都是 big-endian：40 到 54 是 Ethernet 14 位元組，EtherType 0x0800；54 到 74 是 IPv4，長度由 IHL 乘 4 得到 20 位元組，協定 6；74 到 94 是 TCP，長度由資料位移乘 4 得到 20 位元組，目的埠 502；94 到 101 是 MBAP 7 位元組，交易 42、長度 6、Unit 1；101 到 106 是 PDU 5 位元組，FC03 起始 0 數量 10。IP 與 TCP 標頭長度必須從欄位讀出，不能寫死。</desc>
  <defs>
    <marker id="dg-wsp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke-width="1.5" fill="none">
    <rect class="dg-blue" x="130" y="20" width="400" height="52" rx="6" stroke="#3b82f6"/>
    <rect class="dg-blue" x="130" y="94" width="400" height="52" rx="6" stroke="#3b82f6"/>
    <rect class="dg-box" x="130" y="168" width="400" height="52" rx="6" stroke="currentColor"/>
    <rect class="dg-box" x="130" y="242" width="400" height="52" rx="6" stroke="currentColor"/>
    <rect class="dg-box" x="130" y="316" width="400" height="52" rx="6" stroke="currentColor"/>
    <rect class="dg-green" x="130" y="390" width="400" height="52" rx="6" stroke="#2f9e5b"/>
    <rect class="dg-green" x="130" y="464" width="400" height="52" rx="6" stroke="#2f9e5b"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-wsp-arrow)">
    <line x1="330" y1="72" x2="330" y2="92"/>
    <line x1="330" y1="146" x2="330" y2="166"/>
    <line x1="330" y1="220" x2="330" y2="240"/>
    <line x1="330" y1="294" x2="330" y2="314"/>
    <line x1="330" y1="368" x2="330" y2="388"/>
    <line x1="330" y1="442" x2="330" y2="462"/>
  </g>
  <g stroke="currentColor" stroke-width="1.2" fill="none">
    <line x1="560" y1="20" x2="560" y2="146"/>
    <line x1="560" y1="168" x2="560" y2="516"/>
  </g>
  <g fill="currentColor" text-anchor="end" font-size="12">
    <text x="115" y="51">0–24</text>
    <text x="115" y="125">24–40</text>
    <text x="115" y="199">40–54</text>
    <text x="115" y="273">54–74</text>
    <text x="115" y="347">74–94</text>
    <text x="115" y="421">94–101</text>
    <text x="115" y="495">101–106</text>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="330" y="42" font-weight="700">pcap 全域標頭 24 B</text>
    <text x="330" y="61" font-size="12">magic 0xA1B2C3D4，linktype 1（Ethernet）</text>
    <text x="330" y="116" font-weight="700">記錄標頭 16 B</text>
    <text x="330" y="135" font-size="12">時間戳、incl_len ＝ orig_len ＝ 66</text>
    <text x="330" y="190" font-weight="700">Ethernet 14 B</text>
    <text x="330" y="209" font-size="12">目的 MAC、來源 MAC、EtherType 0x0800</text>
    <text x="330" y="264" font-weight="700">IPv4：IHL × 4 ＝ 20 B</text>
    <text x="330" y="283" font-size="12">協定 6（TCP），.5 → .20</text>
    <text x="330" y="338" font-weight="700">TCP：資料位移 × 4 ＝ 20 B</text>
    <text x="330" y="357" font-size="12">50123 → 502；長度要從欄位讀，不可寫死</text>
    <text x="330" y="412" font-weight="700">MBAP 7 B</text>
    <text x="330" y="431" font-size="12">交易 42、協定 0、長度 6、Unit 1</text>
    <text x="330" y="486" font-weight="700">PDU 5 B</text>
    <text x="330" y="505" font-size="12">FC03，起始 0，數量 10</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="570" y="78">little-endian</text>
    <text x="570" y="94">struct 用 "&lt;"</text>
    <text x="570" y="336">big-endian</text>
    <text x="570" y="352">（網路位元組順序）</text>
    <text x="570" y="368">struct 用 "&gt;"</text>
  </g>
  <text x="380" y="560" fill="currentColor" text-anchor="middle" font-size="12">左側是檔案中的位元組位移；整個檔案 24 ＋ 16 ＋ 66 ＝ 106 B，與範例輸出一致。</text>
</svg>
