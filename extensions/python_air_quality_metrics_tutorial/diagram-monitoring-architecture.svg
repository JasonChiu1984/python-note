<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="dg-aqa-title dg-aqa-desc" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <title id="dg-aqa-title">室內遙測與室外官方 AQI 的監測架構圖</title>
  <desc id="dg-aqa-desc">對應正文第 2 節。室內遙測路徑依序是：感測點位（CO₂、PM、溫濕度、壓差、風門回饋、占用），閘道與驗證（保留量測時間、收到時間、單位、品質與校正版本），時間序列倉儲（保存原值與品質旗標，缺值保留不補 0），儀表板與事件單（顯示平均、涵蓋率、最新有效樣本與資料年齡）。平行的室外來源是環境部空氣品質資料集 AQX_P_432 即時值與 AQX_P_434 日值，經獨立的唯讀匯入保留測站、發布時間與抓取時間，只送到儀表板做時間背景對照，不混入室內平均。儀表板也不直接連到 DDC 外氣控制輸出；修改控制需另行評估與現場核准。底部以正文合成資料為例：CO₂ 六格中四格有效，平均 837.5 ppm；PM2.5 只有三格有效，在 60% 門檻下標示資料不足。</desc>
  <defs>
    <marker id="dg-aqa-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="currentColor" font-weight="700" font-size="12">
    <text x="15" y="44">室內遙測路徑</text>
    <text x="15" y="234">平行來源：室外官方測站（不混算）</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <rect class="dg-box dg-blue" x="15" y="56" width="160" height="90" rx="6" stroke="#3b82f6"/>
    <rect class="dg-box" x="205" y="56" width="160" height="90" rx="6"/>
    <rect class="dg-box" x="395" y="56" width="160" height="90" rx="6"/>
    <rect class="dg-box dg-green" x="585" y="56" width="160" height="90" rx="6" stroke="#2f9e5b"/>
    <rect class="dg-box" x="15" y="246" width="250" height="70" rx="6"/>
    <rect class="dg-box" x="300" y="246" width="210" height="70" rx="6"/>
    <rect class="dg-box" x="15" y="390" width="520" height="66" rx="6"/>
  </g>
  <rect class="dg-red" x="575" y="390" width="170" height="66" rx="6" stroke="#d64545" stroke-width="1.5" fill="none"/>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-aqa-arrow)">
    <line x1="175" y1="101" x2="203" y2="101"/>
    <line x1="365" y1="101" x2="393" y2="101"/>
    <line x1="555" y1="101" x2="583" y2="101"/>
    <line x1="265" y1="281" x2="298" y2="281"/>
    <polyline points="510,281 640,281 640,148"/>
  </g>
  <line class="dg-line-red" x1="720" y1="146" x2="720" y2="388" stroke="#d64545" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g fill="currentColor" text-anchor="middle">
    <text x="95" y="80" font-weight="700">感測點位</text>
    <text x="95" y="100" font-size="12">CO₂、PM、溫濕度</text>
    <text x="95" y="118" font-size="12">壓差、風門回饋、占用</text>
    <text x="285" y="80" font-weight="700">閘道與驗證</text>
    <text x="285" y="100" font-size="12">量測時間＋收到時間</text>
    <text x="285" y="118" font-size="12">單位、品質、校正版本</text>
    <text x="475" y="80" font-weight="700">時間序列倉儲</text>
    <text x="475" y="100" font-size="12">原值＋品質旗標</text>
    <text x="475" y="118" font-size="12">缺值保留，不補 0</text>
    <text x="665" y="80" font-weight="700">儀表板／事件單</text>
    <text x="665" y="100" font-size="12">平均＋涵蓋率</text>
    <text x="665" y="118" font-size="12">最新有效樣本、資料年齡</text>
    <text x="140" y="273" font-weight="700">環境部 AQX_P_432／434</text>
    <text x="140" y="295" font-size="12">即時 AQI／日 AQI，含指標污染物</text>
    <text x="405" y="273" font-weight="700">唯讀匯入</text>
    <text x="405" y="295" font-size="12">測站、發布時間、抓取時間</text>
    <text x="660" y="417" font-weight="700">DDC 外氣控制</text>
    <text x="660" y="437" font-size="12">另行評估、現場核准</text>
    <text x="275" y="416" font-size="12">正文合成資料：CO₂ 有效 4／6 格 → 837.5 ppm，可顯示；</text>
    <text x="275" y="436" font-size="12">PM2.5 有效 3／6 格 → 60% 門檻下標示資料不足，不用 0 代替</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="520" y="271">只作時間背景對照</text>
    <text x="712" y="330" text-anchor="end">✕ 不直接連</text>
    <text x="712" y="348" text-anchor="end">控制輸出</text>
  </g>
</svg>
