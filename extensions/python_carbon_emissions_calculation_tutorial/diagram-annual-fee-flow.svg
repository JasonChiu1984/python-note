<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-labelledby="dg-caf-title dg-caf-desc" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <title id="dg-caf-title">年度範疇一、二彙總與碳費試算流程圖</title>
  <desc id="dg-caf-desc">對應延伸範例的 annual_totals() 與 carbon_fee()。12 個月的電力、天然氣與柴油活動量先加總成年度值：52,310,000 kWh、1,910,200 立方公尺、6,400 公升。接著分成三個結果：範疇一為天然氣乘 2.09 加柴油乘 2.61，得 4,009.02 公噸；範疇二地區基礎為全年用電乘 0.466，得 24,376.46 公噸；範疇二市場基礎扣除 6,000,000 kWh 憑證後乘 0.466，得 21,580.46 公噸，另行揭露，不與地區基礎相加。範疇一加地區基礎合計 28,385.48 公噸，再判斷是否超過 25,000 公噸。未超過時計費排放量為 0；超過時以超過部分 3,385.48 公噸乘一般費率每公噸 300 元，得新台幣 1,015,644 元。</desc>
  <defs>
    <marker id="dg-caf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <rect class="dg-box dg-blue" x="200" y="12" width="360" height="48" rx="24" stroke="#3b82f6"/>
    <rect class="dg-box" x="200" y="84" width="360" height="52" rx="6"/>
    <rect class="dg-box" x="15" y="172" width="230" height="78" rx="6"/>
    <rect class="dg-box" x="265" y="172" width="230" height="78" rx="6"/>
    <rect class="dg-box" x="230" y="296" width="300" height="52" rx="6"/>
    <polygon class="dg-box" points="380,374 540,412 380,450 220,412"/>
  </g>
  <g stroke-width="1.5" fill="none">
    <rect class="dg-orange dg-dash" x="515" y="172" width="230" height="78" rx="6" stroke="#e07b1f" stroke-dasharray="6 4"/>
    <rect class="dg-green" x="15" y="480" width="200" height="60" rx="6" stroke="#2f9e5b"/>
    <rect class="dg-red" x="250" y="480" width="300" height="60" rx="6" stroke="#d64545"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-caf-arrow)">
    <line x1="380" y1="60" x2="380" y2="82"/>
    <polyline points="380,136 380,154 130,154 130,170"/>
    <line x1="380" y1="136" x2="380" y2="170"/>
    <polyline points="380,154 630,154 630,170"/>
    <polyline points="130,250 130,322 228,322"/>
    <line x1="380" y1="250" x2="380" y2="294"/>
    <line x1="380" y1="348" x2="380" y2="372"/>
    <polyline points="220,412 115,412 115,478"/>
    <line x1="380" y1="450" x2="380" y2="478"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="380" y="33" font-weight="700">12 個月活動量</text>
    <text x="380" y="51" font-size="12">電力 kWh、天然氣 m³、柴油 L（緊急發電機）</text>
    <text x="380" y="106" font-weight="700">annual_totals() 年度加總</text>
    <text x="380" y="125" font-size="12">52,310,000 kWh／1,910,200 m³／6,400 L</text>
    <text x="130" y="196" font-weight="700">範疇一</text>
    <text x="130" y="216" font-size="12">天然氣 × 2.09 ＋ 柴油 × 2.61</text>
    <text x="130" y="237" font-size="12">4,009.02 tCO₂e</text>
    <text x="380" y="196" font-weight="700">範疇二｜地區基礎</text>
    <text x="380" y="216" font-size="12">全年 kWh × 0.466</text>
    <text x="380" y="237" font-size="12">24,376.46 tCO₂e</text>
    <text x="630" y="196" font-weight="700">範疇二｜市場基礎</text>
    <text x="630" y="216" font-size="12">（kWh − 6,000,000 憑證）× 0.466</text>
    <text x="630" y="237" font-size="12">21,580.46 tCO₂e</text>
    <text x="380" y="318" font-weight="700">範疇一＋二（地區基礎）</text>
    <text x="380" y="337" font-size="12">28,385.48 tCO₂e</text>
    <text x="380" y="409" font-weight="700">合計 &gt; 25,000 t？</text>
    <text x="380" y="428" font-size="12">carbon_fee() 門檻</text>
    <text x="115" y="505" font-weight="700">否：計費排放量 0</text>
    <text x="115" y="525" font-size="12">不需繳一般費率碳費</text>
    <text x="400" y="505" font-weight="700">是：（28,385.48 − 25,000）× 300</text>
    <text x="400" y="525" font-size="12">計費 3,385.48 t，NT$ 1,015,644</text>
    <text x="630" y="276" font-size="12">另行揭露，</text>
    <text x="630" y="293" font-size="12">不與地區基礎相加</text>
    <text x="380" y="572" font-size="12">電力 0.466 為 114 年度產業電力排碳係數；燃料係數是教學假設值。只示範一般費率，</text>
    <text x="380" y="590" font-size="12">優惠費率與自主減量計畫的條件須依碳費收費辦法另行核對。</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="160" y="404">否</text>
    <text x="388" y="468">是</text>
  </g>
</svg>
