<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 680" role="img" aria-labelledby="dg-ibf-title dg-ibf-desc" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <title id="dg-ibf-title">CDD 基線、正規化節能量與 CUSUM 的計算與判斷流程圖</title>
  <desc id="dg-ibf-desc">對應延伸範例的 fit() 與報告期迴圈。先取基線期 12 個月的月用電與冷房度日，涵蓋完整季節且期間沒有重大設備增減。用 statistics.linear_regression() 建模，得到 kWh 等於 174,717 加 606.3 乘 CDD。接著檢查 R 平方、CV(RMSE) 與殘差：本例 0.999 與 0.9%；若殘差有季節型態或單月離群，例如誤植讀值，先查原始資料、補變數或換平衡點溫度，不要直接使用。通過後把報告期實際 CDD 代入模型，實際值減預期值得到每月差值，負值代表少用；7、8 月 CDD 370 與 365 高於基線最大 355，屬輕微外推，需註記。再判斷是否有靜態因素變化，例如新增負載：若有，做非例行調整並記錄依據。然後累計 CUSUM 並標上改善日期：1 到 3 月累計 −1,086，4 月起斜率轉負，12 月為 −222,793。最後報告正規化節能量 222,793 kWh，占預期的 6.6%；直接相減兩年用電只有 4.2%。</desc>
  <defs>
    <marker id="dg-ibf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <rect class="dg-box dg-blue" x="30" y="12" width="380" height="50" rx="25" stroke="#3b82f6"/>
    <rect class="dg-box" x="30" y="86" width="380" height="52" rx="6"/>
    <polygon class="dg-box" points="220,162 400,198 220,234 40,198"/>
    <rect class="dg-box" x="30" y="258" width="380" height="68" rx="6"/>
    <polygon class="dg-box" points="220,350 400,386 220,422 40,386"/>
    <rect class="dg-box" x="30" y="446" width="380" height="68" rx="6"/>
  </g>
  <g stroke-width="1.5" fill="none">
    <rect class="dg-green" x="30" y="538" width="380" height="68" rx="6" stroke="#2f9e5b"/>
    <rect class="dg-red" x="460" y="150" width="285" height="96" rx="6" stroke="#d64545"/>
    <rect class="dg-orange" x="460" y="342" width="285" height="88" rx="6" stroke="#e07b1f"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-ibf-arrow)">
    <line x1="220" y1="62" x2="220" y2="84"/>
    <line x1="220" y1="138" x2="220" y2="160"/>
    <line x1="400" y1="198" x2="458" y2="198"/>
    <line x1="220" y1="234" x2="220" y2="256"/>
    <line x1="220" y1="326" x2="220" y2="348"/>
    <line x1="400" y1="386" x2="458" y2="386"/>
    <line x1="220" y1="422" x2="220" y2="444"/>
    <line x1="220" y1="514" x2="220" y2="536"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="220" y="33" font-weight="700">基線期 12 個月：月用電與 CDD</text>
    <text x="220" y="52" font-size="12">涵蓋完整季節，期間沒有重大設備增減</text>
    <text x="220" y="108" font-weight="700">linear_regression() 建模</text>
    <text x="220" y="127" font-size="12">kWh = 174,717 + 606.3 × CDD</text>
    <text x="220" y="194">R²、CV(RMSE) 與殘差</text>
    <text x="220" y="212">都合理？</text>
    <text x="220" y="280" font-weight="700">報告期實際 CDD 代入模型</text>
    <text x="220" y="299" font-size="12">每月差值 = 實際 − 預期（負值代表少用）</text>
    <text x="220" y="316" font-size="12">7、8 月 CDD 370、365 高於基線最大 355：註記外推</text>
    <text x="220" y="391">有靜態因素變化？</text>
    <text x="220" y="468" font-weight="700">累計 CUSUM，標上改善日期</text>
    <text x="220" y="487" font-size="12">1～3 月累計 −1,086，在零附近擺動</text>
    <text x="220" y="504" font-size="12">4 月起斜率轉負，12 月 −222,793</text>
    <text x="220" y="560" font-weight="700">報告正規化節能量</text>
    <text x="220" y="579" font-size="12">222,793 kWh，占預期 6.6%</text>
    <text x="220" y="596" font-size="12">直接相減兩年用電只有 4.2%：報告期較熱</text>
    <text x="602" y="174" font-weight="700">不要直接使用模型</text>
    <text x="602" y="196" font-size="12">殘差有季節型態：補變數或換平衡點溫度</text>
    <text x="602" y="214" font-size="12">單月離群（例如誤植讀值）：回查原始資料</text>
    <text x="602" y="234" font-size="12">本例 R² 0.999、CV(RMSE) 0.9%</text>
    <text x="602" y="366" font-weight="700">非例行調整</text>
    <text x="602" y="388" font-size="12">例：新增伺服器機櫃、產線擴建</text>
    <text x="602" y="406" font-size="12">估算後從實際值扣除或加變數</text>
    <text x="602" y="422" font-size="12">記錄調整依據與版本</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="414" y="190">否</text>
    <text x="228" y="250">是</text>
    <text x="414" y="378">是</text>
    <text x="228" y="438">否</text>
  </g>
  <text x="380" y="640" fill="currentColor" text-anchor="middle" font-size="12">圖中數字都是範例實際輸出；資料為合成，基線與報告期的 CDD 基準溫度與氣象站須固定。</text>
  <text x="380" y="662" fill="currentColor" text-anchor="middle" font-size="12">CUSUM 只看出轉折時間點，歸因仍要對照改善工作紀錄與量測邊界。</text>
</svg>
