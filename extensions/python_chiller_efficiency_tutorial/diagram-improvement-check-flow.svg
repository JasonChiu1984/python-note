<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" role="img" aria-labelledby="dg-cic-title dg-cic-desc" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <title id="dg-cic-title">冰機 kW/RT 突然改善時的查核流程圖</title>
  <desc id="dg-cic-desc">對應延伸學習的現場案例步驟。kW/RT 在數月內明顯改善，例如從 0.57 降到 0.53 時，先查供回水溫度感測器在同一水溫下的差值是否小於 0.1 °C；不是就先校正感測器，該期間結果標記為低信賴度。接著查 ΔT 是否至少 2 °C；低於 2 °C 多半是低負載或停機時段，標記低信賴度，不列入趨勢。再查冷量與各電表是否用同一時間窗、電表邊界是否沒變；不是就修正對時或電表範圍後重算。三項都通過，才把改善日期與負載率、冷卻水進水溫對照，作為改善候選，仍須用量測基準查證節電量。</desc>
  <defs>
    <marker id="dg-cic-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <rect class="dg-box dg-blue" x="30" y="12" width="380" height="48" rx="24" stroke="#3b82f6"/>
    <polygon class="dg-box" points="220,84 405,122 220,160 35,122"/>
    <polygon class="dg-box" points="220,188 405,226 220,264 35,226"/>
    <polygon class="dg-box" points="220,292 405,330 220,368 35,330"/>
    <rect class="dg-box" x="30" y="396" width="380" height="56" rx="6"/>
  </g>
  <g stroke-width="1.5" fill="none">
    <rect class="dg-red" x="460" y="96" width="285" height="52" rx="6" stroke="#d64545"/>
    <rect class="dg-orange" x="460" y="200" width="285" height="52" rx="6" stroke="#e07b1f"/>
    <rect class="dg-red" x="460" y="304" width="285" height="52" rx="6" stroke="#d64545"/>
    <rect class="dg-green" x="30" y="480" width="380" height="56" rx="6" stroke="#2f9e5b"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-cic-arrow)">
    <line x1="220" y1="60" x2="220" y2="82"/>
    <line x1="405" y1="122" x2="458" y2="122"/>
    <line x1="220" y1="160" x2="220" y2="186"/>
    <line x1="405" y1="226" x2="458" y2="226"/>
    <line x1="220" y1="264" x2="220" y2="290"/>
    <line x1="405" y1="330" x2="458" y2="330"/>
    <line x1="220" y1="368" x2="220" y2="394"/>
    <line x1="220" y1="452" x2="220" y2="478"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="220" y="33" font-weight="700">kW/RT 數月內明顯改善</text>
    <text x="220" y="51" font-size="12">例：0.57 → 0.53，看似省 7%</text>
    <text x="220" y="118" font-size="12">供回水感測器同水溫比對</text>
    <text x="220" y="135" font-size="12">差值 &lt; 0.1 °C？</text>
    <text x="220" y="230" font-size="12">ΔT ≥ 2 °C？</text>
    <text x="220" y="326" font-size="12">冷量與各電表同一時間窗、</text>
    <text x="220" y="343" font-size="12">電表邊界沒有改變？</text>
    <text x="220" y="419" font-weight="700">對照改善上線日期</text>
    <text x="220" y="439" font-size="12">同負載率、同冷卻水進水溫的時段比較</text>
    <text x="220" y="503" font-weight="700">列為改善候選</text>
    <text x="220" y="523" font-size="12">節電量仍須以量測基準查證</text>
    <text x="602" y="118" font-weight="700">先校正感測器</text>
    <text x="602" y="137" font-size="12">漂移期間的結果標記低信賴度</text>
    <text x="602" y="222" font-weight="700">低負載或停機時段</text>
    <text x="602" y="241" font-size="12">標記低信賴度，不列入趨勢</text>
    <text x="602" y="326" font-weight="700">修正對時或電表範圍</text>
    <text x="602" y="345" font-size="12">重算後再比較，不混用前後口徑</text>
    <text x="380" y="566" font-size="12">0.2 °C 的反向漂移就能讓 ΔT 從 5.5 變 5.9 °C，冷量高估約 7%；先排除量測，再談設備改善。</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="420" y="114">否</text>
    <text x="228" y="180">是</text>
    <text x="420" y="218">否</text>
    <text x="228" y="284">是</text>
    <text x="420" y="322">否</text>
    <text x="228" y="388">是</text>
  </g>
</svg>
