<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="dg-cba-title dg-cba-desc" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <title id="dg-cba-title">冰機與全廠能效的量測點、邊界與兩個失真來源</title>
  <desc id="dg-cba-desc">對應延伸範例的 15 分鐘平均資料。負載側的空調箱與盤管把熱量帶回冰水；冰水量測點讀到流量 45 L/s、供水 7.0 °C、回水 12.5 °C，冷量為 45 乘 4.186 乘 5.5，等於 1,036.0 kW、294.6 RT。冰機電表 168.0 kW 與冷量相除，得冰機邊界 0.570 kW/RT、COP 6.17。再加上輔機電表的冰水泵 18.5、冷卻水泵 22.0、冷卻塔 11.0 kW，全廠 219.5 kW，得全廠邊界 0.745 kW/RT、COP 4.72。兩個失真來源：供回水溫度感測器反向漂移 0.2 °C 會讓冰機 kW/RT 落在 0.532 到 0.615；負載側閥件或盤管問題造成低 ΔT，ΔT 3.5 °C 時冰水流量增為 70.7 L/s，冰水泵上限估計 71.8 kW，全廠惡化到 0.926 kW/RT。</desc>
  <defs>
    <marker id="dg-cba-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <rect class="dg-box" x="20" y="40" width="190" height="64" rx="6"/>
    <rect class="dg-box" x="260" y="140" width="250" height="56" rx="6"/>
    <rect class="dg-box" x="20" y="250" width="190" height="56" rx="6"/>
    <rect class="dg-box" x="20" y="340" width="190" height="76" rx="6"/>
  </g>
  <g stroke-width="1.5" fill="none">
    <rect class="dg-blue" x="260" y="40" width="250" height="64" rx="6" stroke="#3b82f6"/>
    <rect class="dg-green" x="260" y="250" width="250" height="56" rx="6" stroke="#2f9e5b"/>
    <rect class="dg-green" x="260" y="350" width="250" height="56" rx="6" stroke="#2f9e5b"/>
    <rect class="dg-red dg-dash" x="550" y="32" width="195" height="80" rx="6" stroke="#d64545" stroke-dasharray="6 4"/>
    <rect class="dg-orange dg-dash" x="550" y="338" width="195" height="80" rx="6" stroke="#e07b1f" stroke-dasharray="6 4"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-cba-arrow)">
    <line x1="210" y1="72" x2="258" y2="72"/>
    <line x1="385" y1="104" x2="385" y2="138"/>
    <line x1="385" y1="196" x2="385" y2="248"/>
    <line x1="210" y1="278" x2="258" y2="278"/>
    <line x1="385" y1="306" x2="385" y2="348"/>
    <line x1="210" y1="378" x2="258" y2="378"/>
  </g>
  <g stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#dg-cba-arrow)">
    <line class="dg-line-red" x1="550" y1="72" x2="512" y2="72" stroke="#d64545"/>
    <line x1="550" y1="378" x2="512" y2="378" stroke="currentColor"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="115" y="66" font-weight="700">負載側 AHU／盤管</text>
    <text x="115" y="86" font-size="12">二通閥、旁通閥決定回水溫</text>
    <text x="385" y="66" font-weight="700">冰水量測點</text>
    <text x="385" y="86" font-size="12">45 L/s，供 7.0 °C／回 12.5 °C</text>
    <text x="385" y="163" font-weight="700">冷量 45 × 4.186 × 5.5</text>
    <text x="385" y="183" font-size="12">1,036.0 kW ＝ 294.6 RT</text>
    <text x="115" y="273" font-weight="700">冰機電表</text>
    <text x="115" y="293" font-size="12">168.0 kW</text>
    <text x="115" y="364" font-weight="700">輔機電表</text>
    <text x="115" y="384" font-size="12">冰水泵 18.5、冷卻水泵 22.0</text>
    <text x="115" y="402" font-size="12">冷卻塔 11.0 kW</text>
    <text x="385" y="273" font-weight="700">冰機邊界</text>
    <text x="385" y="293" font-size="12">0.570 kW/RT，COP 6.17</text>
    <text x="385" y="373" font-weight="700">全廠邊界（219.5 kW）</text>
    <text x="385" y="393" font-size="12">0.745 kW/RT，COP 4.72</text>
    <text x="647" y="56" font-weight="700">感測器漂移</text>
    <text x="647" y="76" font-size="12">供、回反向各偏 0.2 °C</text>
    <text x="647" y="95" font-size="12">冰機 0.532～0.615 kW/RT</text>
    <text x="647" y="362" font-weight="700">低 ΔT 3.5 °C（負載側）</text>
    <text x="647" y="382" font-size="12">流量 70.7 L/s，冰水泵 ≤ 71.8 kW</text>
    <text x="647" y="401" font-size="12">全廠惡化到 0.926 kW/RT</text>
    <text x="380" y="468" font-size="12">冷量與每個電表都用同一個 15 分鐘時間窗；全廠分母要含所有列入邊界的設備。</text>
    <text x="380" y="487" font-size="12">低 ΔT 的泵浦功率以流量三次方估計，是上限；固定差壓控制下增幅較小。</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="393" y="333">＋輔機</text>
  </g>
</svg>
