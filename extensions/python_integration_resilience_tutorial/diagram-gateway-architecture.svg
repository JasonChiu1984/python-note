<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="dg-cba-title dg-cba-desc" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <title id="dg-cba-title">閘道器架構：本地控制路徑與上傳路徑分開</title>
  <desc id="dg-cba-desc">對應延伸學習的現場案例。上排是本地控制路徑：Modbus 電表與控制器經 Modbus TCP 每 5 秒被輪詢，輪詢與需量控制執行緒把資料寫入本地持久化佇列後立即返回，不等網路。下排是上傳路徑：上傳執行緒與輪詢分開執行，從佇列依序取出資料，經斷路器的 call() 以 HTTPS 上傳到雲端能源平台，平台當機時每次逾時 10 秒；成功才從佇列刪除。斷路器的狀態轉換寫入日誌並告警。改善前上傳與輪詢在同一執行緒，平台逾時讓輪詢週期從 5 秒拉長到 15 秒；改善後平台當機只會讓佇列變長，佇列也要設上限與告警。</desc>
  <defs>
    <marker id="dg-cba-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="currentColor" font-size="12" font-weight="700">
    <text x="20" y="28">本地控制路徑：不得等網路</text>
    <text x="20" y="200">上傳路徑：可等待、可斷路</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <rect class="dg-box" x="20" y="40" width="160" height="64" rx="6"/>
    <rect class="dg-box dg-blue" x="260" y="40" width="220" height="64" rx="6" stroke="#3b82f6"/>
    <rect class="dg-box" x="560" y="40" width="180" height="64" rx="6"/>
    <rect class="dg-box" x="20" y="210" width="160" height="64" rx="6"/>
    <rect class="dg-box dg-orange" x="260" y="210" width="220" height="64" rx="6" stroke="#e07b1f"/>
    <rect class="dg-box" x="560" y="210" width="180" height="64" rx="6"/>
    <rect class="dg-box" x="260" y="330" width="220" height="56" rx="6"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-cba-arrow)">
    <line x1="180" y1="72" x2="258" y2="72"/>
    <line x1="480" y1="72" x2="558" y2="72"/>
    <line x1="650" y1="104" x2="650" y2="208"/>
    <line x1="560" y1="242" x2="482" y2="242"/>
    <line x1="260" y1="242" x2="182" y2="242"/>
    <line x1="370" y1="274" x2="370" y2="328"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="100" y="68" font-weight="700">現場設備</text>
    <text x="100" y="88" font-size="12">電表、控制器</text>
    <text x="370" y="68" font-weight="700">輪詢與需量控制執行緒</text>
    <text x="370" y="88" font-size="12">本地控制，週期 5 s</text>
    <text x="650" y="68" font-weight="700">本地持久化佇列</text>
    <text x="650" y="88" font-size="12">例如 SQLite，設上限</text>
    <text x="100" y="238" font-weight="700">雲端能源平台</text>
    <text x="100" y="258" font-size="12">當機時每次逾時 10 s</text>
    <text x="370" y="238" font-weight="700">斷路器 CircuitBreaker</text>
    <text x="370" y="258" font-size="12">連續 3 次失敗開路、冷卻 30 s</text>
    <text x="650" y="238" font-weight="700">上傳執行緒</text>
    <text x="650" y="258" font-size="12">與輪詢分開執行</text>
    <text x="370" y="354" font-weight="700">日誌與告警</text>
    <text x="370" y="374" font-size="12">記錄每次狀態轉換</text>
  </g>
  <g fill="currentColor" font-size="12" text-anchor="middle">
    <text x="219" y="64">Modbus</text>
    <text x="219" y="92">TCP 每 5 s</text>
    <text x="519" y="64">寫入即返回</text>
    <text x="519" y="92">不等網路</text>
    <text x="521" y="234">call()</text>
    <text x="221" y="234">HTTPS</text>
    <text x="221" y="262">上傳</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="660" y="132">依序取出</text>
    <text x="660" y="150">成功才刪除</text>
    <text x="380" y="306">狀態轉換</text>
  </g>
  <line class="dg-line-red dg-dash" x1="20" y1="176" x2="740" y2="176" stroke="#d64545" stroke-width="1.2" stroke-dasharray="6 4"/>
  <g fill="currentColor" text-anchor="middle" font-size="12">
    <text x="380" y="418">改善前：上傳與輪詢在同一執行緒，平台逾時 10 s 讓輪詢週期從 5 s 拉長到 15 s。</text>
    <text x="380" y="438">改善後：平台當機只會讓佇列變長；紅色虛線以上的路徑不呼叫任何外部系統。</text>
  </g>
</svg>
