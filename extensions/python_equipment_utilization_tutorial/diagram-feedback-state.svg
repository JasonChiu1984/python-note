<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="dg-eus-title dg-eus-desc" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <title id="dg-eus-title">運轉回授狀態機</title>
  <desc id="dg-eus-desc">觀測窗起點承接左端點前最後一筆仍在 TTL 內的回授，沒有就從未知開始。之後任何狀態收到 True 進入運轉、收到 False 進入停止、收到 None 進入未知；運轉或停止在 TTL 內沒有新回授則過期成未知。狀態只依解碼後的回授判斷，不看啟動命令：命令 ON 而回授 OFF 不算運轉，另列待診斷，回授失聯記未知，不能當停機。對照正文算例：0 到 20 分運轉、20 到 35 分停止、35 分過期、37 分品質不良、45 分恢復運轉。</desc>
  <defs>
    <marker id="dg-eus-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <!-- 起始 -->
  <circle cx="380" cy="30" r="9" fill="currentColor"/>
  <!-- 狀態 -->
  <g stroke-width="1.5" fill="none">
    <rect class="dg-green" x="70" y="150" width="170" height="64" rx="24" stroke="#2f9e5b"/>
    <rect class="dg-box" x="520" y="150" width="170" height="64" rx="24" stroke="currentColor"/>
    <rect class="dg-orange" x="295" y="290" width="170" height="64" rx="24" stroke="#e07b1f"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-eus-arrow)">
    <polyline points="371,36 155,100 155,148"/>
    <polyline points="389,36 605,100 605,148"/>
    <line x1="380" y1="39" x2="380" y2="288"/>
    <line x1="240" y1="170" x2="518" y2="170"/>
    <line x1="520" y1="194" x2="242" y2="194"/>
    <polyline points="130,214 130,322 293,322"/>
    <polyline points="630,214 630,322 467,322"/>
    <polyline points="295,300 185,300 185,216"/>
    <polyline points="465,300 575,300 575,216"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="155" y="178" font-weight="700">運轉 run</text>
    <text x="155" y="198" font-size="12">0–20、45–60 分</text>
    <text x="605" y="178" font-weight="700">停止 stop</text>
    <text x="605" y="198" font-size="12">20–35 分</text>
    <text x="380" y="318" font-weight="700">未知 unknown</text>
    <text x="380" y="338" font-size="12">35–45 分</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="163" y="132">窗前 True 仍有效</text>
    <text x="597" y="132" text-anchor="end">窗前 False 仍有效</text>
    <text x="388" y="120">無有效回授</text>
    <text x="310" y="162" text-anchor="middle">收到 False</text>
    <text x="450" y="210" text-anchor="middle">收到 True</text>
    <text x="20" y="246">收到 None，或</text>
    <text x="20" y="262">TTL 內無新回授</text>
    <text x="640" y="246">收到 None，或</text>
    <text x="640" y="262">TTL 內無新回授</text>
    <text x="190" y="290">收到 True（45 分）</text>
    <text x="478" y="290">收到 False</text>
  </g>
  <rect class="dg-box dg-blue" x="40" y="372" width="680" height="46" rx="6" stroke="#3b82f6" stroke-width="1.5" fill="none"/>
  <g fill="currentColor" text-anchor="middle" font-size="12">
    <text x="380" y="391">只看解碼後的回授，不看啟動命令：命令 ON、回授 OFF 不算運轉，另列待診斷；</text>
    <text x="380" y="409">回授失聯記 unknown，不當停機。正式系統的 TTL 由來源更新與心跳機制決定（範例用 15 分鐘）。</text>
  </g>
</svg>
