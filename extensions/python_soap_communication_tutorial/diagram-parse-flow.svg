<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" role="img" aria-labelledby="dg-spf-title dg-spf-desc" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <title id="dg-spf-title">parse_response() 判斷流程圖：錯誤、Fault 與正常回應</title>
  <desc id="dg-spf-desc">對應延伸範例的 parse_response()。收到回應後依序判斷。第一，XML 能否剖析，不能就回傳錯誤「XML 無法剖析」。第二，根元素是否為 SOAP 1.1 或 1.2 命名空間的 Envelope，不是就回傳「不是 SOAP Envelope」，例如沒有命名空間的 Envelope。第三，是否有 Body，沒有就回傳「缺少 Body」。以上三種錯誤都回傳 ('錯誤', None, 原因)，不讓 ParseError 或 AttributeError 外洩給上層。第四，Body 內若有 Fault，依版本取代碼與訊息：SOAP 1.1 的 faultcode 與 faultstring 不帶命名空間，SOAP 1.2 取 Code/Value 與 Reason/Text，回傳 ('Fault', 代碼, 訊息)，例如 soap:Client 或 soap:Sender。第五，沒有 Fault 時取 GetPointResponse/value，缺少就回傳「回應缺少 value」，否則回傳 ('OK', 22.5, 'degC')。</desc>
  <defs>
    <marker id="dg-spf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke-width="1.5" fill="none">
    <rect class="dg-blue" x="60" y="14" width="340" height="40" rx="20" stroke="#3b82f6"/>
    <polygon class="dg-box" points="40,110 230,74 420,110 230,146" stroke="currentColor"/>
    <polygon class="dg-box" points="40,195 230,159 420,195 230,231" stroke="currentColor"/>
    <polygon class="dg-box" points="40,280 230,244 420,280 230,316" stroke="currentColor"/>
    <polygon class="dg-box" points="40,365 230,329 420,365 230,401" stroke="currentColor"/>
    <polygon class="dg-box" points="40,450 230,414 420,450 230,486" stroke="currentColor"/>
    <rect class="dg-red" x="470" y="70" width="270" height="250" rx="8" stroke="#d64545"/>
    <rect class="dg-orange" x="470" y="330" width="270" height="88" rx="8" stroke="#e07b1f"/>
    <rect class="dg-red" x="470" y="430" width="270" height="40" rx="8" stroke="#d64545"/>
    <rect class="dg-green" x="60" y="512" width="340" height="52" rx="8" stroke="#2f9e5b"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-spf-arrow)">
    <line x1="230" y1="54" x2="230" y2="72"/>
    <line x1="230" y1="146" x2="230" y2="157"/>
    <line x1="230" y1="231" x2="230" y2="242"/>
    <line x1="230" y1="316" x2="230" y2="327"/>
    <line x1="230" y1="401" x2="230" y2="412"/>
    <line x1="230" y1="486" x2="230" y2="510"/>
    <line x1="420" y1="110" x2="468" y2="110"/>
    <line x1="420" y1="195" x2="468" y2="195"/>
    <line x1="420" y1="280" x2="468" y2="280"/>
    <line x1="420" y1="365" x2="468" y2="365"/>
    <line x1="420" y1="450" x2="468" y2="450"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="230" y="39" font-weight="700">收到 HTTP 回應本文（XML 文字）</text>
    <text x="230" y="115">① ET.fromstring() 能剖析？</text>
    <text x="230" y="191">② 根元素是 1.1／1.2 的</text>
    <text x="230" y="208" font-size="12">soap:Envelope？</text>
    <text x="230" y="285">③ 有 Body？</text>
    <text x="230" y="370">④ Body 內有 Fault？</text>
    <text x="230" y="455">⑤ 有 GetPointResponse/value？</text>
    <text x="230" y="534" font-weight="700">回傳 ('OK', 22.5, 'degC')</text>
    <text x="230" y="553" font-size="12">float(value.text)，單位取 unit 屬性</text>
    <text x="605" y="94" font-weight="700">回傳 ('錯誤', None, 原因)</text>
    <text x="605" y="112" font-size="12">不讓 ParseError／AttributeError 外洩</text>
    <text x="605" y="142" font-size="12">原因：XML 無法剖析</text>
    <text x="605" y="200" font-size="12">原因：不是 SOAP Envelope</text>
    <text x="605" y="218" font-size="12">例：沒有命名空間的 &lt;Envelope&gt;</text>
    <text x="605" y="285" font-size="12">原因：缺少 Body</text>
    <text x="605" y="352" font-weight="700">回傳 ('Fault', 代碼, 訊息)</text>
    <text x="605" y="372" font-size="12">1.1：faultcode、faultstring 不帶命名空間</text>
    <text x="605" y="390" font-size="12">1.2：Code/Value、Reason/Text</text>
    <text x="605" y="408" font-size="12">例：soap:Client／soap:Sender</text>
    <text x="605" y="455" font-size="12">原因：回應缺少 value</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="430" y="104">否</text>
    <text x="430" y="189">否</text>
    <text x="430" y="274">否</text>
    <text x="430" y="359">是</text>
    <text x="430" y="444">否</text>
    <text x="238" y="155">是</text>
    <text x="238" y="240">是</text>
    <text x="238" y="325">是</text>
    <text x="238" y="410">否</text>
    <text x="238" y="503">是</text>
  </g>
  <text x="380" y="594" fill="currentColor" text-anchor="middle" font-size="12">先確認是 SOAP、再看 Fault，最後才取業務資料；任何輸入都只回傳判定結果。</text>
</svg>
