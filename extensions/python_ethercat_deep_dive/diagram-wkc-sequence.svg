<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="img" aria-labelledby="dg-ews-title dg-ews-desc" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <title id="dg-ews-title">LRW datagram 沿線累加 WKC 與主站比對的序列圖</title>
  <desc id="dg-ews-desc">對應延伸範例的 expected_wkc() 與 lrw_contribution()。主站送出一個 LRW datagram，WKC 初值 0。為了方便加總，圖中把 SubDevice 依映射類型分組，實際順序依拓樸。4 台只讀站各加 1，WKC 變 4；2 台只寫站各加 2，WKC 變 8；6 台讀寫站各加 3，WKC 變 26，frame 折返主站。主站把收到的 WKC 和依組態算出的期望值 26 比對：等於 26 只代表讀寫貢獻總數相符，不代表每個位元組都已存取、資料新鮮或輸出已動作；收到 23 少 3，可能是一台讀寫站讀寫都沒完成，或一台只讀加一台只寫各少一筆；收到 25 少 1，可能是一台只讀站沒完成讀取，也可能是一台讀寫站讀取失敗但寫入成功。WKC 只給總和，當筆資料要標成不可用，再用 AL 狀態、FMMU／SyncManager 映射與錯誤計數器定位。</desc>
  <defs>
    <marker id="dg-ews-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke-width="1.5" fill="none">
    <rect class="dg-blue" x="20" y="12" width="150" height="48" rx="6" stroke="#3b82f6"/>
    <rect class="dg-box" x="210" y="12" width="160" height="48" rx="6" stroke="currentColor"/>
    <rect class="dg-box" x="400" y="12" width="160" height="48" rx="6" stroke="currentColor"/>
    <rect class="dg-box" x="590" y="12" width="150" height="48" rx="6" stroke="currentColor"/>
  </g>
  <g stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" fill="none">
    <line x1="95" y1="60" x2="95" y2="300"/>
    <line x1="290" y1="60" x2="290" y2="300"/>
    <line x1="480" y1="60" x2="480" y2="300"/>
    <line x1="665" y1="60" x2="665" y2="300"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-ews-arrow)">
    <line x1="95" y1="110" x2="288" y2="110"/>
    <line x1="290" y1="160" x2="478" y2="160"/>
    <line x1="480" y1="210" x2="663" y2="210"/>
    <line x1="665" y1="270" x2="97" y2="270"/>
  </g>
  <g stroke-width="1.5" fill="none">
    <rect class="dg-green" x="20" y="330" width="720" height="48" rx="6" stroke="#2f9e5b"/>
    <rect class="dg-red" x="20" y="392" width="720" height="48" rx="6" stroke="#d64545"/>
    <rect class="dg-orange" x="20" y="454" width="720" height="48" rx="6" stroke="#e07b1f"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="95" y="33" font-weight="700">MainDevice</text>
    <text x="95" y="51" font-size="12">期望 WKC 26</text>
    <text x="290" y="33" font-weight="700">只讀站 × 4</text>
    <text x="290" y="51" font-size="12">各 +1</text>
    <text x="480" y="33" font-weight="700">只寫站 × 2</text>
    <text x="480" y="51" font-size="12">各 +2</text>
    <text x="665" y="33" font-weight="700">讀寫站 × 6</text>
    <text x="665" y="51" font-size="12">各 +3</text>
    <text x="192" y="100" font-size="12">LRW，WKC = 0</text>
    <text x="384" y="150" font-size="12">WKC 0 → 4</text>
    <text x="572" y="200" font-size="12">WKC 4 → 8</text>
    <text x="380" y="260" font-size="12">WKC 8 → 26，frame 折返主站</text>
    <text x="380" y="292" font-size="12">分組只為加總方便；實際依拓樸順序逐台經過</text>
    <text x="380" y="351" font-weight="700">收到 26 ＝ 期望：讀寫貢獻總數與組態相符</text>
    <text x="380" y="369" font-size="12">不代表每個位元組都已存取、取樣新鮮或輸出已動作</text>
    <text x="380" y="413" font-weight="700">收到 23（少 3）：一台讀寫站未處理，或只讀＋只寫各一台失效</text>
    <text x="380" y="431" font-size="12">WKC 只給總和，用 AL 狀態、映射與錯誤計數器定位</text>
    <text x="380" y="475" font-weight="700">收到 25（少 1）：只讀站漏讀，或讀寫站讀失敗、寫成功</text>
    <text x="380" y="493" font-size="12">當筆資料標成不可用，告警可另訂防抖</text>
    <text x="380" y="528" font-size="12">+1／+2／+3 是 LRW 的計數規則；期望值由主站依實際組態計算，不是設備台數</text>
  </g>
</svg>
