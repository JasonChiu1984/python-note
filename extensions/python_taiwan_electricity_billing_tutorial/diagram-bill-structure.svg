<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="dg-tba-title dg-tba-desc" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <title id="dg-tba-title">時間電價帳單組成與 BAS 可調整的對象</title>
  <desc id="dg-tba-desc">總表或 AMI 的 15 分鐘區間資料分成兩條路徑。第一條依尖峰、半尖峰、離峰分桶累計 kWh，乘以各時段單價得到流動電費，正文示範為 212,000 元。第二條把每個區間的 kWh 除以 0.25 小時得到需量，取當月最高需量。契約容量乘以單價得到基本電費，示範 180 kW 乘 150 元為 27,000 元；最高需量超過契約容量的部分另依契約條款計超約加收。BAS 的移峰策略，例如預冷、儲冰、延後可延負載，改變的是各時段 kWh；錯開冰機啟動與需量限制改變的是最高需量。把 1,000 kWh 從尖峰移到離峰，示範的流動電費少 3,500 元，但最高需量沒變時，基本電費與超約項目不會因此下降。</desc>
  <defs>
    <marker id="dg-tba-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <rect class="dg-box dg-blue" x="20" y="195" width="150" height="86" rx="6" stroke="#3b82f6"/>
    <rect class="dg-box" x="210" y="100" width="240" height="56" rx="6"/>
    <rect class="dg-box" x="210" y="210" width="240" height="56" rx="6"/>
    <rect class="dg-box" x="210" y="320" width="240" height="56" rx="6"/>
    <rect class="dg-box" x="495" y="100" width="250" height="56" rx="6"/>
    <rect class="dg-box" x="495" y="210" width="250" height="56" rx="6"/>
    <rect class="dg-box" x="20" y="496" width="725" height="52" rx="6"/>
  </g>
  <g stroke-width="1.5" fill="none">
    <rect class="dg-red" x="495" y="320" width="250" height="56" rx="6" stroke="#d64545"/>
    <rect class="dg-orange" x="210" y="10" width="240" height="50" rx="6" stroke="#e07b1f"/>
    <rect class="dg-orange" x="210" y="420" width="240" height="50" rx="6" stroke="#e07b1f"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-tba-arrow)">
    <polyline points="170,225 190,225 190,128 208,128"/>
    <polyline points="170,251 190,251 190,348 208,348"/>
    <line x1="450" y1="128" x2="493" y2="128"/>
    <line x1="450" y1="230" x2="493" y2="230"/>
    <polyline points="450,252 472,252 472,336 493,336"/>
    <line x1="450" y1="360" x2="493" y2="360"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-tba-arrow)" class="dg-dash" stroke-dasharray="6 4">
    <line x1="330" y1="60" x2="330" y2="98"/>
    <line x1="330" y1="420" x2="330" y2="378"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="95" y="228" font-weight="700">總表／AMI</text>
    <text x="95" y="248" font-size="12">15 分鐘區間 kWh</text>
    <text x="95" y="266" font-size="12">與台電帳單對帳</text>
    <text x="330" y="31" font-weight="700">BAS 移峰</text>
    <text x="330" y="49" font-size="12">預冷、儲冰、延後可延負載</text>
    <text x="330" y="124" font-weight="700">時段分桶 kWh</text>
    <text x="330" y="144" font-size="12">尖峰／半尖峰／離峰，依台電日曆</text>
    <text x="330" y="234" font-weight="700">契約容量 kW</text>
    <text x="330" y="254" font-size="12">示範 180 kW</text>
    <text x="330" y="344" font-weight="700">15 分鐘需量 kW</text>
    <text x="330" y="364" font-size="12">區間 kWh ÷ 0.25 h，取當月最高</text>
    <text x="330" y="441" font-weight="700">錯開冰機啟動、需量限制</text>
    <text x="330" y="459" font-size="12">預測 15 分鐘平均將超標時先卸載</text>
    <text x="620" y="124" font-weight="700">流動電費</text>
    <text x="620" y="144" font-size="12">Σ 時段 kWh × 單價；示範 212,000 元</text>
    <text x="620" y="234" font-weight="700">基本電費</text>
    <text x="620" y="254" font-size="12">契約 kW × 單價；示範 27,000 元</text>
    <text x="620" y="344" font-weight="700">超約加收</text>
    <text x="620" y="364" font-size="12">最高需量超過契約的部分，依條款計</text>
    <text x="382" y="518" font-size="12">示範：1,000 kWh 從尖峰（6.00 元）移到離峰（2.50 元），流動電費少 3,500 元；</text>
    <text x="382" y="537" font-size="12">若最高需量沒有改變，基本電費與超約加收都不會因此下降。單價與契約皆為合成值。</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="338" y="84">改變各時段 kWh</text>
    <text x="338" y="404">改變最高需量</text>
  </g>
</svg>
