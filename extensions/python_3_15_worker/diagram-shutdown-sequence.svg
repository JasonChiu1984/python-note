<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" role="img" aria-labelledby="dg-wks-title dg-wks-desc" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <title id="dg-wks-title">有界佇列背壓與 TaskGroup 停機序列圖</title>
  <desc id="dg-wks-desc">對應範例 run(stop_after=3)。producer 連續放入 1、2、3 後佇列已滿，之後每當 consumer 取走一筆才能再放一筆，最後送到 put 6 並卡在 put 7。consumer 完成第 3 筆後拋出 Shutdown，TaskGroup 取消 producer，再把 Shutdown 包成 ExceptionGroup 交給 run() 的 except*。run() 以 get_nowait 排出佇列中尚未處理的 4、5、6，正式系統應把它們寫回持久化儲存。</desc>
  <defs>
    <marker id="dg-wks-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <!-- 參與者 -->
  <g stroke="currentColor" stroke-width="1.5">
    <rect class="dg-box dg-blue" x="20" y="14" width="120" height="44" rx="6" stroke="#3b82f6"/>
    <rect class="dg-box" x="165" y="14" width="120" height="44" rx="6"/>
    <rect class="dg-box" x="310" y="14" width="120" height="44" rx="6"/>
    <rect class="dg-box dg-orange" x="455" y="14" width="130" height="44" rx="6" stroke="#e07b1f"/>
    <rect class="dg-box" x="610" y="14" width="130" height="44" rx="6"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-weight="700">
    <text x="80" y="41">run()</text>
    <text x="225" y="41">TaskGroup</text>
    <text x="370" y="41">producer</text>
    <text x="520" y="34">Queue</text>
    <text x="675" y="41">consumer</text>
  </g>
  <text x="520" y="51" fill="currentColor" text-anchor="middle" font-size="11">maxsize=3</text>
  <!-- 生命線 -->
  <g stroke="currentColor" stroke-width="1" stroke-dasharray="4 4" opacity=".6">
    <line x1="80" y1="58" x2="80" y2="575"/>
    <line x1="225" y1="58" x2="225" y2="575"/>
    <line x1="370" y1="58" x2="370" y2="575"/>
    <line x1="520" y1="58" x2="520" y2="575"/>
    <line x1="675" y1="58" x2="675" y2="575"/>
  </g>
  <!-- 訊息 -->
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-wks-arrow)">
    <line x1="80" y1="92" x2="223" y2="92"/>
    <line x1="370" y1="140" x2="518" y2="140"/>
    <line x1="675" y1="190" x2="522" y2="190"/>
    <line x1="370" y1="238" x2="518" y2="238"/>
    <line class="dg-line-red" x1="675" y1="300" x2="227" y2="300" stroke="#d64545"/>
    <line class="dg-line-red" x1="225" y1="354" x2="368" y2="354" stroke="#d64545"/>
    <line x1="225" y1="410" x2="82" y2="410"/>
    <line class="dg-line-green" x1="80" y1="476" x2="518" y2="476" stroke="#2f9e5b"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="88" y="84">async with：建立兩個子任務</text>
    <text x="378" y="132">put 1、2、3 → 佇列已滿</text>
    <text x="530" y="182">get 1（空出一格）</text>
    <text x="378" y="230">put 4；之後每空一格才放一筆</text>
    <text x="378" y="256">（背壓：await q.put() 等待）</text>
    <text x="240" y="292">done 3 後 raise Shutdown</text>
    <text x="233" y="346">取消 producer</text>
    <text x="233" y="372">（停在 await put(7)，最後一筆是 put 6）</text>
    <text x="90" y="402">ExceptionGroup(Shutdown)</text>
    <text x="90" y="430">except* Shutdown：記錄停機原因</text>
    <text x="90" y="468">get_nowait() 排出 4、5、6</text>
  </g>
  <!-- 結果 -->
  <rect class="dg-green" x="60" y="500" width="480" height="58" rx="6" stroke="#2f9e5b" stroke-width="1.5" fill="none"/>
  <g fill="currentColor" text-anchor="middle">
    <text x="300" y="524" font-weight="700">已完成 [2, 4, 6]；佇列中未處理 [4, 5, 6]</text>
    <text x="300" y="545" font-size="12">正式系統：把未處理項目寫回 SQLite／磁碟佇列，重啟後依序號補做</text>
  </g>
</svg>
