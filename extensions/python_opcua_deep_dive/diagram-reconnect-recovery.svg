<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="dg-uaf-title dg-uaf-desc" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <title id="dg-uaf-title">OPC UA 重連與補傳流程圖</title>
  <desc id="dg-uaf-desc">偵測失聯後先標記 degraded，退避後建立新 SecureChannel。若 ActivateSession 能沿用舊 Session，直接從下一個預期序號 Republish；否則建立新 Session 並嘗試 TransferSubscriptions，成功也進入 Republish，失敗則重建 Subscription 與 MonitoredItems 並重新解析 NamespaceArray。Republish 直到 Bad_MessageNotAvailable；缺口補齊就恢復一般 Publish，補不齊或重建時以 Read 或 ResendData 恢復現值、記錄缺口並依支援補歷史，最後恢復一般 Publish。</desc>
  <defs>
    <marker id="dg-uaf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <rect class="dg-orange" x="110" y="14" width="240" height="40" rx="20" stroke="#e07b1f"/>
    <rect class="dg-box" x="70" y="84" width="320" height="40" rx="6"/>
    <polygon class="dg-box" points="230,160 390,200 230,240 70,200"/>
    <rect class="dg-box" x="480" y="180" width="220" height="40" rx="6"/>
    <polygon class="dg-box" points="590,262 730,300 590,338 450,300"/>
    <rect class="dg-box dg-blue" x="70" y="276" width="320" height="48" rx="6"/>
    <rect class="dg-box" x="460" y="372" width="260" height="48" rx="6"/>
    <polygon class="dg-box" points="230,372 360,410 230,448 100,410"/>
    <rect class="dg-orange" x="460" y="468" width="260" height="48" rx="6" stroke="#e07b1f"/>
    <rect class="dg-green" x="90" y="556" width="280" height="44" rx="22" stroke="#2f9e5b"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-uaf-arrow)">
    <line x1="230" y1="54" x2="230" y2="82"/>
    <line x1="230" y1="124" x2="230" y2="158"/>
    <line x1="390" y1="200" x2="478" y2="200"/>
    <line x1="590" y1="220" x2="590" y2="260"/>
    <line x1="230" y1="240" x2="230" y2="274"/>
    <line x1="450" y1="300" x2="392" y2="300"/>
    <line x1="590" y1="338" x2="590" y2="370"/>
    <line x1="230" y1="324" x2="230" y2="370"/>
    <polyline points="360,410 420,410 420,492 458,492"/>
    <line x1="590" y1="420" x2="590" y2="466"/>
    <line x1="230" y1="448" x2="230" y2="554"/>
    <polyline points="590,516 590,578 372,578"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="230" y="39" font-weight="700">偵測失聯：標記 degraded</text>
    <text x="230" y="109">退避（含抖動）後建立新 SecureChannel</text>
    <text x="230" y="196">ActivateSession</text>
    <text x="230" y="214" font-size="12">能沿用舊 Session？</text>
    <text x="590" y="205">CreateSession（新 Session）</text>
    <text x="590" y="296">TransferSubscriptions</text>
    <text x="590" y="314" font-size="12">伺服器支援且身分相符？</text>
    <text x="230" y="296">從下一個預期序號 Republish</text>
    <text x="230" y="314" font-size="12">直到 Bad_MessageNotAvailable</text>
    <text x="590" y="392">重建 Subscription、MonitoredItems</text>
    <text x="590" y="410" font-size="12">重新解析 NamespaceArray</text>
    <text x="230" y="415">序號缺口已補齊？</text>
    <text x="590" y="488">Read／ResendData 恢復現值</text>
    <text x="590" y="506" font-size="12">記錄缺口時間窗，依支援補歷史</text>
    <text x="230" y="583" font-weight="700">恢復一般 Publish</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="400" y="192">否</text>
    <text x="240" y="262">是</text>
    <text x="404" y="292">是</text>
    <text x="600" y="358">否</text>
    <text x="370" y="402">否</text>
    <text x="240" y="500">是</text>
  </g>
</svg>
