<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 640" role="img" aria-labelledby="dg-uas-title dg-uas-desc" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <title id="dg-uas-title">OPC UA 連線到第一筆通知的序列圖</title>
  <desc id="dg-uas-desc">Python Client 依序對 OPC UA Server 呼叫 OpenSecureChannel、CreateSession、ActivateSession，接著讀取 NamespaceArray 把 Namespace URI 解析成本次索引；再以 CreateSubscription 和 CreateMonitoredItems 提出要求值，伺服器回覆修訂後的發布間隔、取樣間隔與佇列大小。Client 送出 Publish 請求後收到含序號的 NotificationMessage，回呼只把保留 StatusCode 與時間戳的 DataValue 放入有界的應用佇列。</desc>
  <defs>
    <marker id="dg-uas-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <rect class="dg-box dg-green" x="20" y="16" width="140" height="44" rx="8"/>
    <rect class="dg-box dg-blue" x="260" y="16" width="140" height="44" rx="8"/>
    <rect class="dg-box dg-blue" x="580" y="16" width="140" height="44" rx="8"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-weight="700">
    <text x="90" y="43">應用佇列</text>
    <text x="330" y="43">Python Client</text>
    <text x="650" y="43">OPC UA Server</text>
  </g>
  <g stroke="currentColor" stroke-width="1" stroke-dasharray="4 4" opacity="0.55">
    <line x1="90" y1="60" x2="90" y2="625"/>
    <line x1="330" y1="60" x2="330" y2="625"/>
    <line x1="650" y1="60" x2="650" y2="625"/>
  </g>
  <!-- 請求（實線）與回覆（虛線） -->
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-uas-arrow)">
    <line x1="330" y1="100" x2="646" y2="100"/>
    <line x1="330" y1="170" x2="646" y2="170"/>
    <line x1="330" y1="240" x2="646" y2="240"/>
    <line x1="330" y1="310" x2="646" y2="310"/>
    <line x1="330" y1="380" x2="646" y2="380"/>
    <line x1="330" y1="450" x2="646" y2="450"/>
    <line x1="330" y1="520" x2="646" y2="520"/>
    <line x1="330" y1="600" x2="94" y2="600"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#dg-uas-arrow)">
    <line x1="650" y1="130" x2="334" y2="130"/>
    <line x1="650" y1="200" x2="334" y2="200"/>
    <line x1="650" y1="270" x2="334" y2="270"/>
    <line x1="650" y1="340" x2="334" y2="340"/>
    <line x1="650" y1="410" x2="334" y2="410"/>
    <line x1="650" y1="480" x2="334" y2="480"/>
    <line class="dg-line-green" x1="650" y1="550" x2="334" y2="550" stroke="#2f9e5b"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="490" y="93">OpenSecureChannel（Policy、Mode）</text>
    <text x="490" y="123" font-size="12">通道與安全權杖</text>
    <text x="490" y="163">CreateSession</text>
    <text x="490" y="193" font-size="12">Session ID、伺服器憑證</text>
    <text x="490" y="233">ActivateSession（使用者身分）</text>
    <text x="490" y="263" font-size="12">Good；失敗時不改用匿名或 None</text>
    <text x="490" y="303">Read NamespaceArray</text>
    <text x="490" y="333" font-size="12">URI → 本次索引（如 ns=4）</text>
    <text x="490" y="373">CreateSubscription（要求 1 s）</text>
    <text x="490" y="403" font-size="12">revisedPublishingInterval</text>
    <text x="490" y="443">CreateMonitoredItems（250 ms、queue 4）</text>
    <text x="490" y="473" font-size="12">revisedSamplingInterval、revisedQueueSize</text>
    <text x="490" y="513">Publish 請求</text>
    <text x="490" y="543" font-size="12" font-weight="700">NotificationMessage（序號 n，DataValue）</text>
    <text x="210" y="593" font-size="12">put_nowait：值＋StatusCode＋時間戳</text>
  </g>
</svg>
