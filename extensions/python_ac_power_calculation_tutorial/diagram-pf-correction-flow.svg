<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 770" role="img" aria-labelledby="dg-apf-title dg-apf-desc" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <title id="dg-apf-title">三相功率加總、不平衡檢查與功因改善電容量估算流程圖</title>
  <desc id="dg-apf-desc">對應延伸範例的 phase_power()、unbalance_pct() 與 capacitor_kvar()。先取同一時間窗、同一量測點的三相相電壓、相電流與落後角。phase_power() 把每相表示成複功率，R 相為 33.57 kW 加 24.39 kvar。三相複數加總後再求功率因數：總和 96.89 kW 加 70.84 kvar，120.02 kVA，PF 0.807，不是三相 PF 的平均。接著判斷不平衡是否偏高：本例線電壓 0.95%、電流 3.80%；偏高時先查接點、三相負載分配與上游供電，不平衡不是電容能解決的。再以平均負載估算電容量：Qc 等於 P 乘以 tanφ1 減 tanφ2，從 0.807 改善到 0.95 約需 39.0 kvar。然後檢查最低負載是否會過度補償：夜間 30 kW、PF 0.85 的無效功率只有 18.6 kvar，固定 39 kvar 會超前，應改用自動功因調整器分段投入。最後檢查後端是否有變頻器或明顯諧波：若有，先量諧波頻譜並評估諧振，改用串聯電抗器的電容組或主動式濾波器。都通過後定案，並以量測驗證。</desc>
  <defs>
    <marker id="dg-apf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <rect class="dg-box dg-blue" x="30" y="12" width="380" height="50" rx="25" stroke="#3b82f6"/>
    <rect class="dg-box" x="30" y="86" width="380" height="52" rx="6"/>
    <rect class="dg-box" x="30" y="162" width="380" height="52" rx="6"/>
    <polygon class="dg-box" points="220,238 400,272 220,306 40,272"/>
    <rect class="dg-box" x="30" y="330" width="380" height="52" rx="6"/>
    <polygon class="dg-box" points="220,406 400,440 220,474 40,440"/>
    <polygon class="dg-box" points="220,522 400,556 220,590 40,556"/>
  </g>
  <g stroke-width="1.5" fill="none">
    <rect class="dg-green" x="30" y="638" width="380" height="52" rx="6" stroke="#2f9e5b"/>
    <rect class="dg-red" x="460" y="230" width="285" height="84" rx="6" stroke="#d64545"/>
    <rect class="dg-orange" x="460" y="398" width="285" height="84" rx="6" stroke="#e07b1f"/>
    <rect class="dg-red" x="460" y="514" width="285" height="84" rx="6" stroke="#d64545"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-apf-arrow)">
    <line x1="220" y1="62" x2="220" y2="84"/>
    <line x1="220" y1="138" x2="220" y2="160"/>
    <line x1="220" y1="214" x2="220" y2="236"/>
    <line x1="400" y1="272" x2="458" y2="272"/>
    <line x1="220" y1="306" x2="220" y2="328"/>
    <line x1="220" y1="382" x2="220" y2="404"/>
    <line x1="400" y1="440" x2="458" y2="440"/>
    <line x1="220" y1="474" x2="220" y2="520"/>
    <line x1="400" y1="556" x2="458" y2="556"/>
    <line x1="220" y1="590" x2="220" y2="636"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="220" y="33" font-weight="700">三相量測：相電壓、相電流、落後角</text>
    <text x="220" y="52" font-size="12">同一時間窗、同一量測點</text>
    <text x="220" y="108" font-weight="700">phase_power()：每相複功率</text>
    <text x="220" y="127" font-size="12">S = V·I·e^(jφ) ÷ 1000；R 相 33.57 kW ＋ j24.39 kvar</text>
    <text x="220" y="184" font-weight="700">複數加總後再求 PF</text>
    <text x="220" y="203" font-size="12">ΣS = 96.89 ＋ j70.84 → 120.02 kVA，PF 0.807</text>
    <text x="220" y="277">不平衡偏高？</text>
    <text x="220" y="352" font-weight="700">capacitor_kvar()：以平均負載估算</text>
    <text x="220" y="371" font-size="12">Qc = P(tanφ₁ − tanφ₂)；0.807 → 0.95 約 39.0 kvar</text>
    <text x="220" y="445">最低負載會過度補償？</text>
    <text x="220" y="561">後端有變頻器或明顯諧波？</text>
    <text x="220" y="660" font-weight="700">定案，再以電力分析儀驗證</text>
    <text x="220" y="679" font-size="12">PF、THD、電容組電流都要量，不只看電費單</text>
    <text x="602" y="254" font-weight="700">先處理不平衡，電容解決不了</text>
    <text x="602" y="276" font-size="12">本例線電壓 0.95%、電流 3.80%</text>
    <text x="602" y="296" font-size="12">查接點鬆脫、負載分配與上游供電</text>
    <text x="602" y="422" font-weight="700">改用自動功因調整器分段投入</text>
    <text x="602" y="444" font-size="12">夜間 30 kW、PF 0.85 只需 18.6 kvar</text>
    <text x="602" y="464" font-size="12">固定 39 kvar 會使 PF 超前</text>
    <text x="602" y="538" font-weight="700">先量諧波頻譜、評估諧振</text>
    <text x="602" y="560" font-size="12">改用串聯電抗器的電容組</text>
    <text x="602" y="580" font-size="12">或主動式濾波器</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="414" y="264">是</text>
    <text x="228" y="322">否</text>
    <text x="414" y="432">是</text>
    <text x="228" y="490">否</text>
    <text x="414" y="548">是</text>
    <text x="228" y="606">否</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4" fill="none" marker-end="url(#dg-apf-arrow)">
    <path d="M602,314 V356 H412"/>
    <path d="M602,482 V506 H222"/>
    <path d="M602,598 V622 H222"/>
  </g>
  <text x="380" y="730" fill="currentColor" text-anchor="middle" font-size="12">虛線：處理後回到主流程繼續。圖中數字都是範例實際輸出（合成資料）。</text>
  <text x="380" y="752" fill="currentColor" text-anchor="middle" font-size="12">台電功率因數電費調整以最新電價表為準；本圖不構成電容選型或現場施工建議。</text>
</svg>
