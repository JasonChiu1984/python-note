<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" role="img" aria-labelledby="dg-fea-title dg-fea-desc" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <title id="dg-fea-title">主電表對帳、公用設施分攤到單位良品能耗的能源流向圖</title>
  <desc id="dg-fea-desc">對應延伸範例的月資料。台電主電表 186,400 kWh 先與分電表對帳：產線 A 72,300、產線 B 58,900、空壓 21,800、冰水 27,600，合計 180,600，未計量 5,800 kWh，占 3.1%，低於 5% 門檻，不分攤到產線而單獨追蹤。空壓依各線流量計比例分攤，A 62% 為 13,516 kWh、B 38% 為 8,284 kWh；冰水依各線冷量計分攤，A 45% 為 12,420 kWh、B 55% 為 15,180 kWh。產線 A 分攤後 98,236 kWh，除以良品 48,200 件為每件 2.038 kWh；產線 B 分攤後 82,364 kWh，除以良品 31,500 件為每件 2.615 kWh。以總產出計算則為 A 1.961、B 2.582 kWh。</desc>
  <defs>
    <marker id="dg-fea-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke-width="1.5" fill="none">
    <rect class="dg-blue" x="15" y="170" width="125" height="66" rx="6" stroke="#3b82f6"/>
    <rect class="dg-box" x="180" y="20" width="150" height="46" rx="6" stroke="currentColor"/>
    <rect class="dg-box" x="180" y="95" width="150" height="46" rx="6" stroke="currentColor"/>
    <rect class="dg-box" x="180" y="185" width="150" height="46" rx="6" stroke="currentColor"/>
    <rect class="dg-box" x="180" y="275" width="150" height="46" rx="6" stroke="currentColor"/>
    <rect class="dg-orange" x="180" y="365" width="150" height="46" rx="6" stroke="#e07b1f"/>
    <rect class="dg-box" x="370" y="173" width="170" height="70" rx="6" stroke="currentColor"/>
    <rect class="dg-box" x="370" y="263" width="170" height="70" rx="6" stroke="currentColor"/>
    <rect class="dg-green" x="585" y="20" width="160" height="100" rx="6" stroke="#2f9e5b"/>
    <rect class="dg-green" x="585" y="140" width="160" height="100" rx="6" stroke="#2f9e5b"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-fea-arrow)">
    <line x1="140" y1="190" x2="178" y2="45"/>
    <line x1="140" y1="196" x2="178" y2="120"/>
    <line x1="140" y1="203" x2="178" y2="208"/>
    <line x1="140" y1="210" x2="178" y2="294"/>
    <line x1="140" y1="216" x2="178" y2="384"/>
    <line x1="330" y1="208" x2="368" y2="208"/>
    <line x1="330" y1="298" x2="368" y2="298"/>
    <line x1="330" y1="43" x2="583" y2="50"/>
    <line x1="330" y1="118" x2="583" y2="172"/>
    <line x1="540" y1="192" x2="583" y2="80"/>
    <line x1="540" y1="216" x2="583" y2="200"/>
    <line x1="540" y1="282" x2="583" y2="95"/>
    <line x1="540" y1="306" x2="583" y2="215"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="77" y="195" font-weight="700">台電主電表</text>
    <text x="77" y="215" font-size="12">186,400 kWh</text>
    <text x="255" y="40" font-weight="700">產線 A</text>
    <text x="255" y="57" font-size="12">72,300 kWh</text>
    <text x="255" y="115" font-weight="700">產線 B</text>
    <text x="255" y="132" font-size="12">58,900 kWh</text>
    <text x="255" y="205" font-weight="700">空壓</text>
    <text x="255" y="222" font-size="12">21,800 kWh</text>
    <text x="255" y="295" font-weight="700">冰水</text>
    <text x="255" y="312" font-size="12">27,600 kWh</text>
    <text x="255" y="385" font-weight="700">未計量</text>
    <text x="255" y="402" font-size="12">5,800 kWh（3.1%）</text>
    <text x="455" y="193" font-weight="700" font-size="12">依流量計分攤</text>
    <text x="455" y="212" font-size="12">A 62%：13,516</text>
    <text x="455" y="230" font-size="12">B 38%：8,284</text>
    <text x="455" y="283" font-weight="700" font-size="12">依冷量計分攤</text>
    <text x="455" y="302" font-size="12">A 45%：12,420</text>
    <text x="455" y="320" font-size="12">B 55%：15,180</text>
    <text x="665" y="42" font-weight="700">產線 A 分攤後</text>
    <text x="665" y="62" font-size="12">98,236 kWh</text>
    <text x="665" y="82" font-size="12">÷ 良品 48,200 件</text>
    <text x="665" y="104" font-weight="700">2.038 kWh／件</text>
    <text x="665" y="162" font-weight="700">產線 B 分攤後</text>
    <text x="665" y="182" font-size="12">82,364 kWh</text>
    <text x="665" y="202" font-size="12">÷ 良品 31,500 件</text>
    <text x="665" y="224" font-weight="700">2.615 kWh／件</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="345" y="384">≤ 5%：不分攤到產線，</text>
    <text x="345" y="402">單獨列「未計量／公共」並追蹤比例</text>
    <text x="745" y="300" text-anchor="end">以總產出計：A 1.961、B 2.582</text>
    <text x="745" y="318" text-anchor="end">分母換成良品，報廢的能耗才看得到</text>
  </g>
  <text x="380" y="448" fill="currentColor" text-anchor="middle" font-size="12">先對帳再分攤：分表合計 180,600 kWh，與主電表差 5,800 kWh；超過 5% 時先查照明、辦公與分表倍率。</text>
  <text x="380" y="470" fill="currentColor" text-anchor="middle" font-size="12">分攤比例與方法要版本化；換方法（例如冰水改用面積比例）時重算歷史資料，指標才能比較。</text>
</svg>
