<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 640" role="img" aria-labelledby="dg-snf-title dg-snf-desc" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <title id="dg-snf-title">計數器速率的品質判斷流程圖</title>
  <desc id="dg-snf-desc">兩筆 IF-MIB octets 樣本依序檢查：樣本型別與範圍、是否同一 agent 與 ifIndex、時間差是否在 0 到 90 秒之間、continuity epoch 與兩次 discontinuity 標記是否一致，以及模數差值是否不超過容量且只有一個候選。任何一關不通過就輸出對應的品質狀態而不是速率；全部通過才輸出 bps 與使用率。</desc>
  <defs>
    <marker id="dg-snf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <rect class="dg-box dg-blue" x="130" y="12" width="260" height="42" rx="21"/>
    <polygon class="dg-box" points="260,84 420,120 260,156 100,120"/>
    <polygon class="dg-box" points="260,186 420,222 260,258 100,222"/>
    <polygon class="dg-box" points="260,288 420,324 260,360 100,324"/>
    <polygon class="dg-box" points="260,390 430,430 260,470 90,430"/>
    <polygon class="dg-box" points="260,500 430,540 260,580 90,540"/>
  </g>
  <g stroke-width="1.5" fill="none">
    <rect class="dg-red" x="480" y="100" width="280" height="40" rx="6" stroke="#d64545"/>
    <rect class="dg-red" x="480" y="202" width="280" height="40" rx="6" stroke="#d64545"/>
    <rect class="dg-orange" x="480" y="304" width="280" height="40" rx="6" stroke="#e07b1f"/>
    <rect class="dg-orange" x="480" y="400" width="280" height="60" rx="6" stroke="#e07b1f"/>
    <rect class="dg-orange" x="480" y="515" width="280" height="50" rx="6" stroke="#e07b1f"/>
    <rect class="dg-green" x="130" y="600" width="260" height="34" rx="6" stroke="#2f9e5b"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-snf-arrow)">
    <line x1="260" y1="54" x2="260" y2="82"/>
    <line x1="260" y1="156" x2="260" y2="184"/>
    <line x1="260" y1="258" x2="260" y2="286"/>
    <line x1="260" y1="360" x2="260" y2="388"/>
    <line x1="260" y1="470" x2="260" y2="498"/>
    <line x1="260" y1="580" x2="260" y2="598"/>
    <line x1="420" y1="120" x2="478" y2="120"/>
    <line x1="420" y1="222" x2="478" y2="222"/>
    <line x1="420" y1="324" x2="478" y2="324"/>
    <line x1="430" y1="430" x2="478" y2="430"/>
    <line x1="430" y1="540" x2="478" y2="540"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="260" y="38" font-weight="700">兩筆樣本 a、b＋容量、位寬</text>
    <text x="260" y="125">型別與範圍有效？</text>
    <text x="260" y="218">同一序列？</text>
    <text x="260" y="236" font-size="12">（agent, ifIndex）</text>
    <text x="260" y="320">0 &lt; Δt ≤ 90 秒？</text>
    <text x="260" y="338" font-size="12">（採集器單調時鐘）</text>
    <text x="260" y="425">連續性證據一致？</text>
    <text x="260" y="443" font-size="12">epoch 相同、兩次標記都回傳且相等</text>
    <text x="260" y="535">d = (C₂ − C₁) mod M</text>
    <text x="260" y="553" font-size="12">d ≤ 容量上限，且 d + M 超過上限？</text>
    <text x="260" y="622" font-weight="700">ok：輸出 bps 與名目使用率</text>
    <text x="620" y="125" font-weight="700">invalid-sample</text>
    <text x="620" y="227" font-weight="700">different-series</text>
    <text x="620" y="329" font-weight="700">time-order／stale-gap</text>
    <text x="620" y="424" font-weight="700">discontinuity</text>
    <text x="620" y="444" font-size="12">invalid-／missing-discontinuity-marker</text>
    <text x="620" y="536" font-weight="700">capacity-exceeded</text>
    <text x="620" y="554" font-weight="700">ambiguous-wrap</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="430" y="112">否</text>
    <text x="430" y="214">否</text>
    <text x="430" y="316">否</text>
    <text x="440" y="422">否</text>
    <text x="440" y="532">否</text>
    <text x="268" y="176">是</text>
    <text x="268" y="278">是</text>
    <text x="268" y="380">是</text>
    <text x="268" y="490">是</text>
    <text x="268" y="594">是</text>
  </g>
</svg>
