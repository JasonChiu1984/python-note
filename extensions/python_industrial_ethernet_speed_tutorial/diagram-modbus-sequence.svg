<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="dg-ems-title dg-ems-desc" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <title id="dg-ems-title">一次 Modbus TCP 讀取交易的時間預算序列圖</title>
  <desc id="dg-ems-desc">對應延伸範例的 frame_bytes() 與 serialization_us()。Python 輪詢程式經過交換器 A、交換器 B 讀取電表。請求是 FC03 讀 10 個暫存器，乙太網路幀 70 位元組，線上另加前導碼與幀間隙 20 位元組；每台交換器轉送延遲假設 100 Mbps 為 5 微秒、1 Gbps 為 1 微秒，來回共經過 4 次。電表處理假設 4,000 微秒。回應幀 87 位元組。100 Mbps 時線上 15.76 微秒加交換器 20.0 微秒加設備 4,000 微秒，共 4.036 毫秒，線上時間只占 0.39%；1 Gbps 時線上 1.58 微秒加交換器 4.0 微秒加設備，共 4.006 毫秒，只快約 0.03 毫秒。60 台電表、每台 5 次交易，預算約 1.21 秒；現場量到 3 秒代表每筆約 10 毫秒，多出的時間在輪詢排程與設備，不在線路速率。</desc>
  <defs>
    <marker id="dg-ems-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke-width="1.5" fill="none">
    <rect class="dg-blue" x="20" y="12" width="150" height="48" rx="6" stroke="#3b82f6"/>
    <rect class="dg-box" x="215" y="12" width="150" height="48" rx="6" stroke="currentColor"/>
    <rect class="dg-box" x="405" y="12" width="150" height="48" rx="6" stroke="currentColor"/>
    <rect class="dg-box" x="590" y="12" width="150" height="48" rx="6" stroke="currentColor"/>
  </g>
  <g stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" fill="none">
    <line x1="95" y1="60" x2="95" y2="300"/>
    <path d="M290,60 V92 M290,112 V126 M290,146 V236 M290,256 V270 M290,290 V300"/>
    <path d="M480,60 V92 M480,112 V126 M480,146 V236 M480,256 V270 M480,290 V300"/>
    <line x1="665" y1="60" x2="665" y2="130"/>
    <line x1="665" y1="236" x2="665" y2="300"/>
  </g>
  <rect class="dg-orange" x="652" y="130" width="26" height="106" rx="3" stroke="#e07b1f" stroke-width="1.5" fill="none"/>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-ems-arrow)">
    <line x1="95" y1="118" x2="650" y2="118"/>
    <line x1="652" y1="262" x2="97" y2="262"/>
  </g>
  <g stroke-width="1.5" fill="none">
    <rect class="dg-blue" x="20" y="320" width="350" height="100" rx="6" stroke="#3b82f6"/>
    <rect class="dg-green" x="390" y="320" width="350" height="100" rx="6" stroke="#2f9e5b"/>
    <rect class="dg-orange" x="20" y="440" width="720" height="104" rx="6" stroke="#e07b1f"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="95" y="33" font-weight="700">Python 輪詢程式</text>
    <text x="95" y="51" font-size="12">依序讀 60 台電表</text>
    <text x="290" y="33" font-weight="700">交換器 A</text>
    <text x="290" y="51" font-size="12">store-and-forward</text>
    <text x="480" y="33" font-weight="700">交換器 B</text>
    <text x="480" y="51" font-size="12">store-and-forward</text>
    <text x="665" y="33" font-weight="700">電表</text>
    <text x="665" y="51" font-size="12">Modbus TCP 伺服端</text>
    <text x="372" y="106">FC03 讀 10 個暫存器：請求幀 70 B（線上 90 B）</text>
    <text x="372" y="140" font-size="12">每台交換器轉送：100M 假設 5 µs、1G 假設 1 µs，來回共 4 次</text>
    <text x="372" y="250">回應幀 87 B（線上 107 B）</text>
    <text x="372" y="284" font-size="12">MBAP 7 ＋ PDU 22 ＋ TCP 20 ＋ IP 20 ＋ 乙太網路標頭與 FCS 18</text>
    <text x="195" y="344" font-weight="700">100 Mbps</text>
    <text x="195" y="368" font-size="12">線上 15.76 µs ＋ 交換器 20.0 µs ＋ 設備 4,000 µs</text>
    <text x="195" y="390">＝ 4.036 ms</text>
    <text x="195" y="410" font-size="12">線上時間只占 0.39%</text>
    <text x="565" y="344" font-weight="700">1 Gbps</text>
    <text x="565" y="368" font-size="12">線上 1.58 µs ＋ 交換器 4.0 µs ＋ 設備 4,000 µs</text>
    <text x="565" y="390">＝ 4.006 ms</text>
    <text x="565" y="410" font-size="12">只快約 0.03 ms（0.75%）</text>
    <text x="380" y="466" font-weight="700">放大到一輪：60 台 × 每台 5 次交易 × 4.03 ms ≈ 1.21 s</text>
    <text x="380" y="492" font-size="12">現場量到 3 s，等於每筆約 10 ms；多出的 6 ms 來自輪詢排程、重建連線或閘道排隊</text>
    <text x="380" y="514" font-size="12">換 Gigabit 只改變線上那幾微秒；要縮短一輪，先減少交易數，再平行連線</text>
    <text x="380" y="534" font-size="12">交換器延遲與設備處理時間都是假設值，現場以封包時間戳或閘道日誌量測</text>
  </g>
  <g fill="currentColor" text-anchor="end" font-size="12">
    <text x="644" y="178" font-weight="700">設備處理 4,000 µs</text>
    <text x="644" y="198">（假設值，占整筆 99% 以上）</text>
  </g>
</svg>
