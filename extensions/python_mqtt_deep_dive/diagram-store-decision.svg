<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" role="img" aria-labelledby="dg-mqf-title dg-mqf-desc" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <title id="dg-mqf-title">store() 落地判斷流程圖</title>
  <desc id="dg-mqf-desc">收到樣本後依序檢查：身分與序號無效回傳 invalid；資料年齡小於負 5 秒回傳 future-clock-skew，大於 30 秒回傳 expired；時效通過才執行 INSERT ON CONFLICT DO NOTHING。插入一列回傳 inserted；未插入時讀回既存的時間與數值，相同回傳 duplicate，不同回傳 identity-conflict。</desc>
  <defs>
    <marker id="dg-mqf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <!-- 主幹 -->
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <rect class="dg-box dg-blue" x="150" y="15" width="220" height="40" rx="20"/>
    <polygon class="dg-box" points="260,90 400,128 260,166 120,128"/>
    <polygon class="dg-box" points="260,196 420,236 260,276 100,236"/>
    <rect class="dg-box dg-blue" x="100" y="310" width="320" height="44" rx="6"/>
    <polygon class="dg-box" points="260,390 390,428 260,466 130,428"/>
    <polygon class="dg-box" points="260,500 420,538 260,576 100,538"/>
  </g>
  <!-- 結果 -->
  <g stroke-width="1.5" fill="none">
    <rect class="dg-red" x="490" y="108" width="250" height="40" rx="6" stroke="#d64545"/>
    <rect class="dg-orange" x="490" y="186" width="250" height="40" rx="6" stroke="#e07b1f"/>
    <rect class="dg-orange" x="490" y="246" width="250" height="40" rx="6" stroke="#e07b1f"/>
    <rect class="dg-green" x="490" y="408" width="250" height="40" rx="6" stroke="#2f9e5b"/>
    <rect class="dg-green" x="490" y="518" width="250" height="40" rx="6" stroke="#2f9e5b"/>
    <rect class="dg-red" x="135" y="606" width="250" height="40" rx="6" stroke="#d64545"/>
  </g>
  <!-- 連線 -->
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-mqf-arrow)">
    <line x1="260" y1="55" x2="260" y2="88"/>
    <line x1="260" y1="166" x2="260" y2="194"/>
    <line x1="260" y1="276" x2="260" y2="308"/>
    <line x1="260" y1="354" x2="260" y2="388"/>
    <line x1="260" y1="466" x2="260" y2="498"/>
    <line x1="260" y1="576" x2="260" y2="604"/>
    <line x1="400" y1="128" x2="488" y2="128"/>
    <polyline points="420,236 460,236 460,206 488,206"/>
    <polyline points="460,236 460,266 488,266"/>
    <line x1="390" y1="428" x2="488" y2="428"/>
    <line x1="420" y1="538" x2="488" y2="538"/>
  </g>
  <!-- 節點文字 -->
  <g fill="currentColor" text-anchor="middle">
    <text x="260" y="40" font-weight="700">收到 Sample 與 now</text>
    <text x="260" y="133">身分與序號有效？</text>
    <text x="260" y="231" font-size="12">age = now − measured_at</text>
    <text x="260" y="250">在 −5～30 秒內？</text>
    <text x="260" y="337" font-family="ui-monospace, monospace" font-size="12">INSERT … ON CONFLICT DO NOTHING</text>
    <text x="260" y="433">rowcount = 1？</text>
    <text x="260" y="543">既存 (ts, value) 相同？</text>
    <text x="615" y="133" font-weight="700">invalid</text>
    <text x="615" y="211" font-weight="700">future-clock-skew（age &lt; −5）</text>
    <text x="615" y="271" font-weight="700">expired（age &gt; 30）</text>
    <text x="615" y="433" font-weight="700">inserted</text>
    <text x="615" y="543" font-weight="700">duplicate</text>
    <text x="260" y="631" font-weight="700">identity-conflict</text>
  </g>
  <!-- 分支標籤 -->
  <g fill="currentColor" font-size="12">
    <text x="410" y="120">否</text>
    <text x="270" y="184">是</text>
    <text x="428" y="228">否</text>
    <text x="270" y="296">是</text>
    <text x="400" y="420">是</text>
    <text x="270" y="486">否（同鍵已存在）</text>
    <text x="430" y="530">是</text>
    <text x="270" y="596">否</text>
  </g>
</svg>
