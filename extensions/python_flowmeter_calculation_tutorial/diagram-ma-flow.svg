<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-labelledby="dg-fmf-title dg-fmf-desc" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <title id="dg-fmf-title">4–20 mA 訊號判讀、差壓開方與小流量切除流程圖</title>
  <desc id="dg-fmf-desc">對應延伸範例的 check_ma()、ma_to_flow_linear() 與 ma_to_flow_dp()。讀到電流後先依 NAMUR NE43 分區：小於或等於 3.6 mA、或大於或等於 21.0 mA 是故障訊號，拋出 ValueError，例如 2.1 mA；小於 3.8 或大於 20.5 mA 是超出量測範圍，同樣拋出 ValueError，例如 20.8 mA 不顯示成 100%。通過後看訊號代表什麼：已線性化的流量直接用 (I − 4) ÷ 16 × 量程，8 mA 得 25 m³/h；原始差壓則開方一次，8 mA 得 50%。開方後低於 6% 的小流量切除回傳 0，例如零點漂移 4.04 mA 開方後是 5%，切除後為 0；否則乘上量程，12 mA 得 70.71 m³/h。開方只能在一個地方做。</desc>
  <defs>
    <marker id="dg-fmf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <rect class="dg-box dg-blue" x="30" y="12" width="380" height="48" rx="24" stroke="#3b82f6"/>
    <polygon class="dg-box" points="220,84 400,118 220,152 40,118"/>
    <polygon class="dg-box" points="220,176 400,210 220,244 40,210"/>
    <polygon class="dg-box" points="220,268 400,302 220,336 40,302"/>
    <rect class="dg-box" x="30" y="360" width="380" height="52" rx="6"/>
    <polygon class="dg-box" points="220,436 400,470 220,504 40,470"/>
  </g>
  <g stroke-width="1.5" fill="none">
    <rect class="dg-red" x="460" y="92" width="285" height="52" rx="6" stroke="#d64545"/>
    <rect class="dg-orange" x="460" y="184" width="285" height="52" rx="6" stroke="#e07b1f"/>
    <rect class="dg-blue" x="460" y="276" width="285" height="52" rx="6" stroke="#3b82f6"/>
    <rect class="dg-orange" x="460" y="444" width="285" height="52" rx="6" stroke="#e07b1f"/>
    <rect class="dg-green" x="30" y="528" width="380" height="56" rx="6" stroke="#2f9e5b"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-fmf-arrow)">
    <line x1="220" y1="60" x2="220" y2="82"/>
    <line x1="400" y1="118" x2="458" y2="118"/>
    <line x1="220" y1="152" x2="220" y2="174"/>
    <line x1="400" y1="210" x2="458" y2="210"/>
    <line x1="220" y1="244" x2="220" y2="266"/>
    <line x1="400" y1="302" x2="458" y2="302"/>
    <line x1="220" y1="336" x2="220" y2="358"/>
    <line x1="220" y1="412" x2="220" y2="434"/>
    <line x1="400" y1="470" x2="458" y2="470"/>
    <line x1="220" y1="504" x2="220" y2="526"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="220" y="33" font-weight="700">讀取 AI：電流、時間、點位設定</text>
    <text x="220" y="51" font-size="12">check_ma() 先判斷 NAMUR NE43 分區</text>
    <text x="220" y="123">≤ 3.6 或 ≥ 21.0 mA？</text>
    <text x="220" y="215">&lt; 3.8 或 &gt; 20.5 mA？</text>
    <text x="220" y="307">訊號是已線性化的流量？</text>
    <text x="220" y="381" font-weight="700">原始差壓：只開方一次</text>
    <text x="220" y="400" font-size="12">flow_pct = √((I − 4) ÷ 16)；8 mA → 50%</text>
    <text x="220" y="475">flow_pct &lt; 6%？</text>
    <text x="220" y="550" font-weight="700">回傳 flow_pct × 量程</text>
    <text x="220" y="570" font-size="12">12 mA → 70.71 m³/h；20 mA → 100 m³/h</text>
    <text x="602" y="114" font-weight="700">故障訊號：拋出 ValueError</text>
    <text x="602" y="133" font-size="12">例：2.1 mA（斷線、短路或自診斷）</text>
    <text x="602" y="206" font-weight="700">超出量測範圍：拋出 ValueError</text>
    <text x="602" y="225" font-size="12">例：20.8 mA 飽和，不顯示成 100%</text>
    <text x="602" y="298" font-weight="700">ma_to_flow_linear()</text>
    <text x="602" y="317" font-size="12">(I − 4) ÷ 16 × 量程；8 mA → 25 m³/h</text>
    <text x="602" y="466" font-weight="700">小流量切除：回傳 0.0</text>
    <text x="602" y="485" font-size="12">零點 4.04 mA 開方是 5% → 0 m³/h</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="414" y="110">是</text>
    <text x="228" y="168">否</text>
    <text x="414" y="202">是</text>
    <text x="228" y="260">否</text>
    <text x="414" y="294">是</text>
    <text x="228" y="352">否</text>
    <text x="414" y="462">是</text>
    <text x="228" y="520">否</text>
  </g>
</svg>
