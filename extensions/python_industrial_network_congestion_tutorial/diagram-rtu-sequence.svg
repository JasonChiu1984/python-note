<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" role="img" aria-labelledby="dg-ncs-title dg-ncs-desc" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <title id="dg-ncs-title">一次 Modbus RTU 交易的時間組成序列圖（19200 bps、讀 20 個暫存器）</title>
  <desc id="dg-ncs-desc">對應延伸範例的 transaction_ms(19200, 20, 15)。BAS 以 Modbus TCP 請求閘道器讀 20 個暫存器；閘道器在 RS-485 上送出 8 位元組的 RTU 請求，每字元 11 位元，約 4.6 毫秒；接著 3.5 字元靜默約 2.0 毫秒，加上假設的從站處理時間 15 毫秒；電表回應 45 位元組，約 25.8 毫秒；再經 3.5 字元靜默約 2.0 毫秒，閘道器才能輪到下一台，並把 Modbus TCP 回應交給 BAS。單次交易約 49.4 毫秒，其中線上傳輸 30.4 毫秒、靜默 4.0 毫秒、從站 15 毫秒；30 台依序輪詢一輪約 1.48 秒，每 2 秒一輪時匯流排使用率約 74%。RS-485 是半雙工，同一時間只能有一筆交易，第二個上位系統的請求只能在閘道器排隊；一台離線、逾時 1 秒時，一輪會拉長到 2.47 秒。</desc>
  <defs>
    <marker id="dg-ncs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke-width="1.5" fill="none">
    <rect class="dg-blue" x="20" y="12" width="180" height="48" rx="6" stroke="#3b82f6"/>
    <rect class="dg-box" x="290" y="12" width="180" height="48" rx="6" stroke="currentColor"/>
    <rect class="dg-box" x="560" y="12" width="180" height="48" rx="6" stroke="currentColor"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="110" y="33" font-weight="700">BAS</text>
    <text x="110" y="51" font-size="12">Modbus TCP 用戶端</text>
    <text x="380" y="33" font-weight="700">序列閘道器</text>
    <text x="380" y="51" font-size="12">TCP → RTU，一次一筆</text>
    <text x="650" y="33" font-weight="700">電表 #7</text>
    <text x="650" y="51" font-size="12">RS-485 從站，19200 bps</text>
  </g>
  <g stroke="currentColor" stroke-width="1" fill="none" stroke-dasharray="6 4" class="dg-dash">
    <line x1="110" y1="60" x2="110" y2="370"/>
    <line x1="380" y1="60" x2="380" y2="282"/>
    <line x1="380" y1="318" x2="380" y2="370"/>
    <line x1="650" y1="60" x2="650" y2="176"/>
    <line x1="650" y1="230" x2="650" y2="370"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-ncs-arrow)">
    <line x1="110" y1="100" x2="378" y2="100"/>
    <line x1="380" y1="150" x2="648" y2="150"/>
    <line x1="650" y1="262" x2="382" y2="262"/>
  </g>
  <g class="dg-line-green" stroke="#2f9e5b" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#dg-ncs-arrow)">
    <line x1="380" y1="350" x2="112" y2="350"/>
  </g>
  <g stroke-width="1.5" fill="none">
    <rect class="dg-orange" x="490" y="176" width="250" height="54" rx="6" stroke="#e07b1f"/>
    <rect class="dg-orange" x="250" y="282" width="260" height="36" rx="6" stroke="#e07b1f"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="120" y="92">① 讀 20 個暫存器（Modbus TCP）</text>
    <text x="390" y="142">② RTU 請求 8 B：8 × 0.573 ＝ 4.6 ms</text>
    <text x="392" y="254">④ RTU 回應 45 B：25.8 ms</text>
    <text x="122" y="342">⑥ Modbus TCP 回應</text>
  </g>
  <g fill="currentColor" font-size="12" text-anchor="middle">
    <text x="615" y="198">③ t3.5 靜默 2.0 ms</text>
    <text x="615" y="218">＋從站處理 15 ms（假設值）</text>
    <text x="380" y="305">⑤ t3.5 靜默 2.0 ms，才輪下一台</text>
  </g>
  <rect class="dg-green" x="20" y="384" width="720" height="52" rx="8" fill="none" stroke="#2f9e5b" stroke-width="1.5"/>
  <text x="380" y="406" fill="currentColor" text-anchor="middle" font-weight="700">單次 49.4 ms ＝ 線上 30.4 ＋ 靜默 4.0 ＋ 從站 15.0</text>
  <text x="380" y="426" fill="currentColor" text-anchor="middle" font-size="12">30 台依序輪詢一輪 1.48 s；每 2 s 一輪，匯流排使用率 74%</text>
  <rect class="dg-red" x="20" y="448" width="720" height="52" rx="8" fill="none" stroke="#d64545" stroke-width="1.5"/>
  <text x="380" y="470" fill="currentColor" text-anchor="middle" font-weight="700">RS-485 半雙工：同一時間只能有一筆交易</text>
  <text x="380" y="490" fill="currentColor" text-anchor="middle" font-size="12">第二個上位系統只能在閘道器排隊；一台離線、逾時 1 s，一輪就變 2.47 s</text>
</svg>
