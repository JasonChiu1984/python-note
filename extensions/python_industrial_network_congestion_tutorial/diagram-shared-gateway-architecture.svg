<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="dg-nca-title dg-nca-desc" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <title id="dg-nca-title">兩個上位系統共用 RS-485 閘道器：直讀與單一輪詢轉發的架構比較</title>
  <desc id="dg-nca-desc">對應延伸學習的現場案例與範例的匯流排使用率計算。左邊是直讀：BAS 與能源平台各自經 Modbus TCP 閘道器、每 2 秒輪詢同一條 19200 bps RS-485 上的 30 台電表，閘道器只能讓請求排隊，匯流排使用率 148%，延遲越積越長。右邊是單一輪詢加轉發：只有 BAS 輪詢匯流排，使用率維持 74%；能源平台改向 BAS 以 BACnet、MQTT 或 API 取值，不再占用序列匯流排。代價是資料多經過一站，介面上要帶時間戳與品質旗標。</desc>
  <defs>
    <marker id="dg-nca-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1" fill="none" class="dg-dash" stroke-dasharray="6 4">
    <rect x="10" y="10" width="360" height="370" rx="10"/>
    <rect x="390" y="10" width="360" height="370" rx="10"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-weight="700">
    <text x="190" y="36">直讀：兩個系統各自輪詢</text>
    <text x="570" y="36">單一輪詢，再轉發</text>
  </g>
  <g stroke-width="1.5" fill="none">
    <rect class="dg-blue" x="30" y="60" width="140" height="48" rx="6" stroke="#3b82f6"/>
    <rect class="dg-blue" x="210" y="60" width="140" height="48" rx="6" stroke="#3b82f6"/>
    <rect class="dg-box" x="90" y="170" width="200" height="52" rx="6" stroke="currentColor"/>
    <rect class="dg-red" x="40" y="290" width="300" height="56" rx="6" stroke="#d64545"/>
    <rect class="dg-blue" x="410" y="60" width="140" height="48" rx="6" stroke="#3b82f6"/>
    <rect class="dg-blue" x="590" y="170" width="140" height="52" rx="6" stroke="#3b82f6"/>
    <rect class="dg-box" x="410" y="170" width="140" height="52" rx="6" stroke="currentColor"/>
    <rect class="dg-green" x="420" y="290" width="300" height="56" rx="6" stroke="#2f9e5b"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-nca-arrow)">
    <line x1="100" y1="108" x2="150" y2="168"/>
    <line x1="280" y1="108" x2="230" y2="168"/>
    <line x1="190" y1="222" x2="190" y2="288"/>
    <line x1="480" y1="108" x2="480" y2="168"/>
    <line x1="480" y1="222" x2="480" y2="288"/>
    <line x1="550" y1="96" x2="640" y2="168"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="100" y="80" font-weight="700">BAS</text>
    <text x="100" y="98" font-size="12">每 2 s 讀 30 台</text>
    <text x="280" y="80" font-weight="700">能源平台</text>
    <text x="280" y="98" font-size="12">也每 2 s 讀 30 台</text>
    <text x="190" y="192" font-weight="700">Modbus TCP 閘道器</text>
    <text x="190" y="211" font-size="12">請求排隊，一次只送一筆</text>
    <text x="190" y="313" font-weight="700">RS-485 19200 bps × 30 台</text>
    <text x="190" y="333" font-size="12">使用率 148%：延遲越積越長</text>
    <text x="480" y="80" font-weight="700">BAS</text>
    <text x="480" y="98" font-size="12">唯一輪詢者</text>
    <text x="660" y="192" font-weight="700">能源平台</text>
    <text x="660" y="211" font-size="12">只向 BAS 取值</text>
    <text x="480" y="192" font-weight="700">閘道器</text>
    <text x="480" y="211" font-size="12">不再排隊</text>
    <text x="570" y="313" font-weight="700">RS-485 19200 bps × 30 台</text>
    <text x="570" y="333" font-size="12">使用率 74%：只有 BAS 的請求</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="602" y="118">轉發：BACnet／</text>
    <text x="614" y="134">MQTT／API</text>
    <text x="198" y="148">Modbus TCP</text>
    <text x="488" y="148">Modbus TCP</text>
  </g>
  <text x="380" y="410" fill="currentColor" text-anchor="middle" font-size="12">使用率＝上位系統數 × 30 台 × 49.4 ms ÷ 2,000 ms；超過 100% 時請求只會排隊，不會變快。</text>
  <text x="380" y="430" fill="currentColor" text-anchor="middle" font-size="12">轉發多一站延遲，介面要帶原始時間戳與品質旗標，讓能源平台知道值是何時讀到的。</text>
</svg>
