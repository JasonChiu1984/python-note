<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="dg-lpc-title dg-lpc-desc" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <title id="dg-lpc-title">同交易寫入讀值與 checkpoint 的崩潰與重啟序列圖</title>
  <desc id="dg-lpc-desc">對應延伸範例的 process(crash_after=5, batch=3)。第一次執行時，程式讀到 checkpoint 0，待處理序號 1 到 10。第一批：BEGIN，插入序號 1 到 3，更新 last_seq 為 3，COMMIT 成功。第二批：BEGIN，插入序號 4 到 6；已完成 3 筆加 3 筆等於 6，大於 5，模擬提交前崩潰，執行 ROLLBACK 並拋出「在處理序號 4–6 時崩潰」，序號 4 到 6 不會留下。重啟時重新開啟資料庫，查得已寫入 3 筆、checkpoint 3。第二次執行從序號 4 繼續，分成 4 到 6、7 到 9、10 三批，每批在同一交易中插入讀值並更新 checkpoint 後 COMMIT。最後共 10 筆，重複 0 筆，無缺漏。reading 以序號為主鍵，即使重送也不會重複寫入。範例的崩潰是程式內 ROLLBACK，不是斷電測試。</desc>
  <defs>
    <marker id="dg-lpc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke-width="1.5" fill="none">
    <rect class="dg-blue" x="30" y="12" width="200" height="48" rx="6" stroke="#3b82f6"/>
    <rect class="dg-box" x="280" y="12" width="200" height="48" rx="6" stroke="currentColor"/>
    <rect class="dg-green" x="530" y="12" width="200" height="48" rx="6" stroke="#2f9e5b"/>
  </g>
  <g stroke="currentColor" stroke-width="1" fill="none" stroke-dasharray="6 4" class="dg-dash">
    <line x1="130" y1="60" x2="130" y2="176"/>
    <line x1="380" y1="60" x2="380" y2="176"/>
    <line x1="380" y1="268" x2="380" y2="478"/>
    <line x1="630" y1="60" x2="630" y2="478"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="130" y="33" font-weight="700">第一次執行</text>
    <text x="130" y="51" font-size="12">process(crash_after=5)</text>
    <text x="380" y="33" font-weight="700">state.db（WAL）</text>
    <text x="380" y="51" font-size="12">reading＋checkpoint</text>
    <text x="630" y="33" font-weight="700">重啟後</text>
    <text x="630" y="51" font-size="12">open_db()＋process()</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#dg-lpc-arrow)">
    <line x1="130" y1="96" x2="378" y2="96"/>
    <line x1="130" y1="156" x2="378" y2="156"/>
    <line x1="630" y1="330" x2="382" y2="330"/>
    <line x1="630" y1="400" x2="382" y2="400"/>
  </g>
  <g class="dg-line-green" stroke="#2f9e5b" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#dg-lpc-arrow)">
    <line x1="380" y1="120" x2="132" y2="120"/>
    <line x1="380" y1="354" x2="628" y2="354"/>
    <line x1="380" y1="452" x2="628" y2="452"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="140" y="89">BEGIN；INSERT 1–3；last_seq=3</text>
    <text x="140" y="114">COMMIT 成功：第一批落地</text>
    <text x="140" y="149">BEGIN；INSERT 4–6</text>
    <text x="390" y="323">SELECT：3 筆，checkpoint = 3</text>
    <text x="390" y="348">從序號 4 繼續（pending 4–10）</text>
    <text x="390" y="393">每批 BEGIN；INSERT；UPDATE</text>
    <text x="390" y="414">批次：4–6、7–9、10</text>
    <text x="390" y="446">每批 COMMIT：資料與進度一起前進</text>
  </g>
  <rect class="dg-red" x="20" y="176" width="440" height="92" rx="6" stroke="#d64545" stroke-width="1.5" fill="none"/>
  <g fill="currentColor" text-anchor="middle">
    <text x="240" y="200" font-weight="700">done 3 ＋ 3 ＝ 6 ＞ 5：提交前「崩潰」</text>
    <text x="240" y="222" font-size="12">ROLLBACK：序號 4–6 與 checkpoint 更新一起消失</text>
    <text x="240" y="244" font-size="12">RuntimeError：在處理序號 4–6 時崩潰</text>
    <text x="240" y="262" font-size="12">checkpoint 仍是 3，不會跳筆也不會殘留半批</text>
  </g>
  <rect class="dg-green" x="300" y="478" width="440" height="56" rx="6" stroke="#2f9e5b" stroke-width="1.5" fill="none"/>
  <g fill="currentColor" text-anchor="middle">
    <text x="520" y="501" font-weight="700">最後 10 筆，重複 0 筆，缺漏：無</text>
    <text x="520" y="521" font-size="12">reading 以序號為主鍵：重送也不會多寫</text>
  </g>
  <rect class="dg-orange" x="20" y="556" width="720" height="48" rx="6" stroke="#e07b1f" stroke-width="1.5" fill="none"/>
  <text x="380" y="578" fill="currentColor" text-anchor="middle" font-size="12" font-weight="700">範例的崩潰是程式內 ROLLBACK，不是斷電測試</text>
  <text x="380" y="596" fill="currentColor" text-anchor="middle" font-size="12">SD 卡、網路磁碟要用 kill -9 或拔電實測 fsync 行為。</text>
</svg>
