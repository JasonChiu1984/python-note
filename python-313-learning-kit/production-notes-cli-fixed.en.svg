<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="production-notes-cli-fixed-en-title production-notes-cli-fixed-en-desc" lang="en" preserveAspectRatio="xMidYMid meet">
<title id="production-notes-cli-fixed-en-title">Production notes-cli workflow</title><desc id="production-notes-cli-fixed-en-desc">Follow ten nodes from requirements to release; rollback is conditional on a release anomaly.</desc>
