[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-note-telemetry-api"
version = "1.0.0"
description = "Synthetic local FastAPI telemetry workshop"
requires-python = ">=3.12"
dependencies = ["fastapi==0.165.0", "pydantic==2.14.4", "uvicorn==0.54.0"]

[project.optional-dependencies]
dev = ["fastapi-cli==0.0.34", "httpx2==2.16.2", "pytest==9.2.0", "build==1.6.1"]

[tool.setuptools.packages.find]
include = ["telemetry_api*"]

[tool.fastapi]
entrypoint = "telemetry_api.main:app"
